<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Astro Crossing: Alien Planet</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; user-select:none; }
  html, body {
    background:#05010d;
    height:100%;
    overflow:hidden;
    font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
    color:#e8e4ff;
    touch-action:none;
  }
  body {
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  #wrap {
    position:relative;
    width:100vw;
    max-width:480px;
    height:100vh;
    max-height:800px;
    display:flex;
    flex-direction:column;
  }
  #canvasHolder {
    position:relative;
    flex:1;
    width:100%;
    background: linear-gradient(#0a0420 0%, #241040 35%, #4a1f4a 65%, #6e3238 100%);
    border:3px solid #7d5ba6;
    border-radius:8px;
    box-shadow: 0 0 30px rgba(140,80,200,0.5);
    overflow:hidden;
  }
  canvas { display:block; width:100%; height:100%; touch-action:none; }
  #hud {
    position:absolute; top:8px; left:8px; right:8px;
    display:flex; justify-content:space-between;
    font-size:16px; font-weight:600; text-shadow:0 0 6px #a86bff;
    pointer-events:none;
    z-index:5;
  }
  #hud span { background:rgba(20,8,35,0.6); padding:4px 10px; border-radius:6px; }
  .mineralHud { display:flex; align-items:center; gap:10px; }
  .mineralHud .mCount { display:flex; align-items:center; gap:4px; }
  .mineralHud .mDot {
    width:11px; height:11px;
    display:inline-block;
    clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
    filter: drop-shadow(0 0 1px rgba(255,255,255,0.85));
  }
  #abductedPanel {
    position:absolute; top:46px; left:8px; right:8px;
    z-index:6;
    display:none;
    flex-wrap:wrap; gap:6px;
    justify-content:center;
    pointer-events:none;
  }
  .abductChip {
    display:flex; align-items:center; gap:6px;
    background:rgba(60,10,10,0.8);
    border:1.5px solid #ff6b6b;
    border-radius:20px;
    padding:3px 12px 3px 3px;
    font-size:14px;
    font-weight:600;
    color:#ffb3b3;
    text-shadow:0 0 4px rgba(255,107,107,0.6);
  }
  .abductChip img {
    width:26px; height:26px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,0.5);
  }
  #msg {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    text-align:center; background:rgba(10,4,20,0.92);
    padding:20px 24px; border-radius:12px; border:2px solid #a86bff;
    display:none; z-index:10; width:80%;
  }
  #msg h1 { color:#ffd166; margin-bottom:10px; font-size:28px; text-shadow:0 0 10px #ffd166;}
  #msg p { margin:6px 0; font-size:17px; color:#cfc3ff; }
  #msg button {
    margin-top:14px; padding:12px 26px; font-size:18px; cursor:pointer;
    background:#a86bff; color:#0a0414; border:none; border-radius:6px; font-weight:bold;
  }
  #interstitial {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    text-align:center; background:rgba(10,4,20,0.88);
    padding:16px 28px; border-radius:12px; border:2px solid #a86bff;
    display:none; z-index:9; pointer-events:none;
  }
  #interstitial h1 { font-size:24px; text-shadow:0 0 10px currentColor; }
  #hint {
    text-align:center;
    font-size:15px;
    color:#9d8ec9;
    padding:10px 8px;
  }
  #startScreen {
    position:absolute; inset:0;
    z-index:20;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at 50% 30%, rgba(60,20,80,0.95), rgba(8,3,16,0.97));
    text-align:center;
    padding:20px;
    overflow:hidden;
  }
  #startScreen .starfield {
    position:absolute; inset:-10% -10%;
    z-index:0;
    pointer-events:none;
    background-image:
      radial-gradient(2.6px 2.6px at 12% 18%, rgba(255,255,255,1), transparent),
      radial-gradient(2px 2px at 38% 62%, rgba(255,255,255,1), transparent),
      radial-gradient(2.4px 2.4px at 66% 32%, rgba(255,255,255,1), transparent),
      radial-gradient(1.8px 1.8px at 82% 78%, rgba(255,255,255,0.95), transparent),
      radial-gradient(2.6px 2.6px at 24% 50%, rgba(255,255,255,1), transparent),
      radial-gradient(1.8px 1.8px at 52% 12%, rgba(255,255,255,0.95), transparent),
      radial-gradient(2.2px 2.2px at 90% 44%, rgba(255,255,255,1), transparent),
      radial-gradient(1.8px 1.8px at 14% 88%, rgba(255,255,255,0.9), transparent);
    background-repeat: repeat;
    background-size: 220px 320px;
    animation: starDrift 5s linear infinite;
    filter: drop-shadow(0 0 2px rgba(255,255,255,0.8));
  }
  @keyframes starDrift {
    from { background-position: 0 0; }
    to { background-position: 0 -320px; }
  }
  #startScreen > * { position:relative; z-index:1; }
  #startScreen h1 {
    font-size:34px;
    color:#ffd166;
    text-shadow:0 0 12px #ffd166;
    margin-bottom:4px;
  }
  #startScreen .proceeding {
    font-size:15px;
    color:#7CFFB2;
    letter-spacing:1.5px;
    text-transform:uppercase;
    margin-bottom:24px;
    animation: proceedPulse 1.4s ease-in-out infinite;
  }
  @keyframes proceedPulse {
    0%, 100% { opacity:0.5; }
    50% { opacity:1; }
  }
  #startScreen .sub {
    font-size:17px;
    color:#cfc3ff;
    margin-bottom:22px;
    letter-spacing:2px;
    text-transform:uppercase;
  }
  #startScreen .crewLabel {
    font-size:16px;
    color:#a86bff;
    text-transform:uppercase;
    letter-spacing:2px;
    margin-bottom:10px;
  }
  #startScreen ul {
    list-style:none;
    margin-bottom:30px;
  }
  #startScreen li {
    display:flex; align-items:center; justify-content:center; gap:10px;
    font-size:20px;
    color:#e8e4ff;
    padding:6px 0;
  }
  #startScreen li .avatar {
    width:36px; height:36px;
    border-radius:50%;
    border:2px solid rgba(255,255,255,0.4);
    flex-shrink:0;
  }
  #startScreen li .newTag {
    color:#7CFFB2;
    font-size:13px;
    margin-left:2px;
    letter-spacing:1px;
    font-weight:600;
  }
  #startScreen button {
    padding:14px 32px; font-size:19px; cursor:pointer;
    background:#a86bff; color:#0a0414; border:none; border-radius:8px; font-weight:bold;
  }
</style>
</head>
<body>

<div id="wrap">
  <div id="canvasHolder">
    <div id="hud">
      <span id="scoreDisp" class="mineralHud"></span>
      <span id="pointsDisp">Points: 0</span>
    </div>
    <div id="abductedPanel"></div>
    <canvas id="game"></canvas>
    <div id="startScreen">
      <div class="starfield"></div>
      <h1 id="startTitle">Astro Crossing</h1>
      <p class="proceeding" id="startSub">Proceeding to Planet ...</p>
      <p class="crewLabel">Mission Crew</p>
      <ul id="crewList"></ul>
      <button id="startBtn">Start Mission</button>
    </div>
    <div id="msg">
      <h1 id="msgTitle">Game Over</h1>
      <p id="msgBody"></p>
      <button id="msgBtn">Play Again</button>
    </div>
    <div id="interstitial">
      <h1 id="interstitialTitle">Wave Complete!</h1>
    </div>
  </div>
  <div id="hint">Tap the aliens to shoot them down &mdash; brutes and spitters take more than one hit!</div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const holder = document.getElementById('canvasHolder');

// Internal logical resolution (game coordinates), scaled to fit the real canvas size
const W = 400, H = 620;
const groundY = H - 90;
const BEAM_DURATION = 36;

function resizeCanvas(){
  const rect = holder.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  canvas.style.width = rect.width + 'px';
  canvas.style.height = rect.height + 'px';
  scaleX = canvas.width / W;
  scaleY = canvas.height / H;
}
let scaleX = 1, scaleY = 1;
window.addEventListener('resize', resizeCanvas);

// --- State ---
let score = 0;
let lives = 3;
let wave = 1;
let gameOver = false;
let frame = 0;
let lasers = [];
let mineralsCollected = 0;
let pendingCrewBonus = 0;
const MAX_ASTRONAUTS = 5;
let gameStarted = false;
let abductedThisWave = [];
let transitioning = false; // true while the wave-result interstitial is showing; aliens keep animating, gameplay logic pauses

// --- Emergency purge button: (re)arms at the start of any wave once total points have
// climbed another 250 past the last time it was armed/used ---
const CONSOLE_H = 64;
const ELIM_BTN = { x: 8, y: H - 35, w: 28, h: 28 };
const TOP_BAR_H = 46;
const ELIM_BTN_COST = 250;
let eliminateUnlocked = false;
let eliminateThreshold = ELIM_BTN_COST; // next point total required to rearm

let banner = null; // { text, timer, max, color }
let bannerQueue = [];
function showBanner(text, color, duration=100){
  banner = { text, timer: duration, max: duration, color };
}
function queueBanner(text, color, duration=110){
  bannerQueue.push({ text, color, duration });
}

const scoreDisp = document.getElementById('scoreDisp');
const pointsDisp = document.getElementById('pointsDisp');
const msgBox = document.getElementById('msg');
const msgTitle = document.getElementById('msgTitle');
const msgBody = document.getElementById('msgBody');
const msgBtn = document.getElementById('msgBtn');
const interstitialBox = document.getElementById('interstitial');
const interstitialTitle = document.getElementById('interstitialTitle');
const startScreen = document.getElementById('startScreen');
const startTitle = document.getElementById('startTitle');
const startSub = document.getElementById('startSub');
const crewListEl = document.getElementById('crewList');
const startBtn = document.getElementById('startBtn');
let newlyJoined = [];

// --- Procedurally generated crew avatars (no external image-gen tool available here) ---
function hashString(str){
  let h = 0;
  for(let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) | 0; }
  return Math.abs(h);
}
const avatarCache = {};
function getAvatarDataURL(name){
  if(avatarCache[name]) return avatarCache[name];
  const hash = hashString(name);
  const SKIN_TONES = ['#f1c27d','#e0ac69','#c68642','#8d5524','#ffdbac','#a0673c','#f4d1ae'];
  const HAIR_COLORS = ['#2c1b18','#4a3222','#7a4a1e','#c9a227','#5c5c5c','#241a17'];
  const EYE_COLORS  = ['#5b3a29','#3b6ea5','#4a7a3c','#6b6b6b','#7a4a1e'];

  const badgeHue = hash % 360;
  const skin = SKIN_TONES[hash % SKIN_TONES.length];
  const hair = HAIR_COLORS[(hash >> 2) % HAIR_COLORS.length];
  const eye = EYE_COLORS[(hash >> 6) % EYE_COLORS.length];
  const hairStyle = (hash >> 4) % 3; // 0 = full, 1 = side-parted, 2 = very short/bald

  const c = document.createElement('canvas');
  c.width = 64; c.height = 64;
  const actx = c.getContext('2d');

  // badge background
  actx.fillStyle = `hsl(${badgeHue},45%,24%)`;
  actx.beginPath(); actx.arc(32,32,32,0,Math.PI*2); actx.fill();

  // suit collar
  actx.fillStyle = `hsl(${(badgeHue+180)%360},50%,42%)`;
  actx.beginPath();
  actx.moveTo(18,58); actx.lineTo(46,58); actx.lineTo(40,48); actx.lineTo(24,48);
  actx.closePath(); actx.fill();

  // hair, drawn behind the face
  if(hairStyle !== 2){
    actx.fillStyle = hair;
    if(hairStyle === 0){
      actx.beginPath(); actx.ellipse(32,24,17,16,0,0,Math.PI*2); actx.fill();
    } else {
      actx.beginPath(); actx.arc(32,25,17,Math.PI*0.95,Math.PI*2.15); actx.fill();
    }
  }

  // face
  actx.fillStyle = skin;
  actx.beginPath(); actx.ellipse(32,31,15,17,0,0,Math.PI*2); actx.fill();

  // short hair fringe on top even for bald style, and side hair for full style
  if(hairStyle === 0){
    actx.fillStyle = hair;
    actx.beginPath(); actx.ellipse(17,32,4,10,0,0,Math.PI*2); actx.fill();
    actx.beginPath(); actx.ellipse(47,32,4,10,0,0,Math.PI*2); actx.fill();
  }
  if(hairStyle !== 2){
    actx.fillStyle = hair;
    actx.beginPath(); actx.ellipse(32,18,16,8,0,0,Math.PI*2); actx.fill();
    actx.fillStyle = skin;
    actx.beginPath(); actx.ellipse(32,24,15,12,0,0,Math.PI*2); actx.fill();
  }

  // eyebrows
  actx.strokeStyle = hair;
  actx.lineWidth = 1.6;
  actx.beginPath(); actx.moveTo(23,25); actx.lineTo(29,24); actx.stroke();
  actx.beginPath(); actx.moveTo(35,24); actx.lineTo(41,25); actx.stroke();

  // eyes
  [26,38].forEach(ex=>{
    actx.fillStyle = '#fff';
    actx.beginPath(); actx.ellipse(ex,29,3.2,2.4,0,0,Math.PI*2); actx.fill();
    actx.fillStyle = eye;
    actx.beginPath(); actx.arc(ex,29,1.6,0,Math.PI*2); actx.fill();
    actx.fillStyle = '#0a0a0a';
    actx.beginPath(); actx.arc(ex,29,0.8,0,Math.PI*2); actx.fill();
  });

  // nose hint
  actx.strokeStyle = 'rgba(0,0,0,0.18)';
  actx.lineWidth = 1;
  actx.beginPath(); actx.moveTo(32,30); actx.lineTo(31,35); actx.stroke();

  // mouth
  actx.strokeStyle = 'rgba(90,40,30,0.75)';
  actx.lineWidth = 1.8;
  actx.beginPath();
  actx.arc(32,37,5, (hash & 4) ? 0.15*Math.PI : 0.1*Math.PI, (hash & 4) ? 0.85*Math.PI : 0.9*Math.PI);
  actx.stroke();

  const url = c.toDataURL();
  avatarCache[name] = url;
  return url;
}

const abductedPanelEl = document.getElementById('abductedPanel');
function updateAbductedPanel(){
  // abducted-crew messages are intentionally no longer shown in the HUD
  abductedPanelEl.style.display = 'none';
}

let modalRevealTimer = null;
function revealAfterDelay(fn, delay){
  if(modalRevealTimer) clearTimeout(modalRevealTimer);
  if(delay > 0){
    modalRevealTimer = setTimeout(fn, delay);
  } else {
    fn();
  }
}

function renderWaveIntro(delayMs){
  msgBox.style.display = 'none';
  startTitle.textContent = `Wave ${wave}`;
  startSub.textContent = `Proceeding to Planet ${theme.name}`;
  startBtn.textContent = wave === 1 ? 'Start Mission' : 'Begin Wave';
  crewListEl.innerHTML = '';
  crewRoster.forEach(name=>{
    const li = document.createElement('li');
    const img = document.createElement('img');
    img.className = 'avatar';
    img.src = getAvatarDataURL(name);
    img.alt = name;
    const label = document.createElement('span');
    label.textContent = 'Astronaut ' + name;
    li.appendChild(img);
    li.appendChild(label);
    if(newlyJoined.includes(name)){
      const tag = document.createElement('span');
      tag.className = 'newTag';
      tag.textContent = 'NEW';
      li.appendChild(tag);
    }
    crewListEl.appendChild(li);
  });
  revealAfterDelay(()=>{ startScreen.style.display = 'flex'; }, delayMs || 0);
}

function beginQueuedWave(){
  startScreen.style.display = 'none';
  newlyJoined = [];
  aliens = [];
  lasers = [];
  spawnAstronauts();
  queueAlienWave();
  spawnMinerals(5);
  gameStarted = true;
  msgBox.style.display = 'none';
  // rearm the purge button at the start of any wave once points have climbed past the next threshold
  if(!eliminateUnlocked && score >= eliminateThreshold) eliminateUnlocked = true;
}

startBtn.addEventListener('click', beginQueuedWave);
startBtn.addEventListener('touchend', e=>{ e.preventDefault(); beginQueuedWave(); });

// --- Fixed shooting origin: bottom-middle of the screen, as if fired from the player's own view ---
const module = {
  x: W/2, y: H - 14
};

// --- Crew roster: persistent last names, assigned once and carried until abducted ---
const CREW_LAST_NAMES = ['Reyes','Chen','Okafor','Novak','Patel','Kessler','Ibrahim','Sato','Moreno','Larsen','Whitfield','Achebe','Delgado','Voss','Nakamura','Kimathi'];
let crewRoster = [];
function generateCrewName(){
  const available = CREW_LAST_NAMES.filter(n => !crewRoster.includes(n));
  const pool = available.length ? available : CREW_LAST_NAMES;
  return pool[Math.floor(Math.random()*pool.length)];
}
function addCrewMember(){
  const name = generateCrewName();
  crewRoster.push(name);
  return name;
}
function removeCrewMember(name){
  const idx = crewRoster.indexOf(name);
  if(idx > -1) crewRoster.splice(idx, 1);
}

// --- Astronauts (always start on the left, walk to the right) ---
const ASTRO_START_SIDE = 'left';
let astronauts = [];
function spawnAstronauts(){
  astronauts = [];
  for(let i=0;i<crewRoster.length;i++){
    astronauts.push({
      name: crewRoster[i],
      x: 22 + i*16, y: groundY, w: 20, h: 28,
      speed: 0.22 + Math.random()*0.1,
      alive:true, safe:false, bob: Math.random()*Math.PI*2,
      state:'beamIn', timer: BEAM_DURATION
    });
  }
}

// --- Alien types ---
const ALIEN_TYPES = {
  scout: { color:'#7CFF6B', dark:'#0a3a12', w:26, h:22, speedMult:1.35, hp:1, score:2, wavy:false, diveOdds:0.45 },
  brute: { color:'#ff6b6b', dark:'#7a1414', w:40, h:34, speedMult:0.6,  hp:3, score:6, wavy:false, diveOdds:0.25 },
  flyer: { color:'#ffe066', dark:'#8a6a00', w:24, h:18, speedMult:1.05, hp:1, score:3, wavy:true,  diveOdds:0.8 },
  spitter:{color:'#c98bff', dark:'#4a1a7a', w:30, h:26, speedMult:0.85, hp:2, score:4, wavy:false, diveOdds:0.6 },
  saucer: { color:'#9fd8ff', dark:'#1a4a66', w:38, h:16, speedMult:1.15, hp:3, score:8, wavy:true,  diveOdds:0.55 }
};

function pickAlienType(){
  // wave 1 is scouts only; tougher types unlock and ramp up in later waves
  const weights = { scout: 1 };
  if(wave >= 2) weights.flyer = 0.55;
  if(wave >= 3) weights.spitter = Math.min(0.15 + (wave-3)*0.08, 0.45);
  if(wave >= 4) weights.brute = Math.min(0.15 + (wave-4)*0.08, 0.4);
  if(wave >= 6) weights.saucer = Math.min(0.2 + (wave-6)*0.06, 0.5);

  const entries = Object.entries(weights);
  const total = entries.reduce((s,[,w])=>s+w, 0);
  let r = Math.random()*total;
  for(const [type,w] of entries){
    if(r < w) return type;
    r -= w;
  }
  return 'scout';
}

// --- Aliens: spawned gradually through the wave, from both sides and the sky, then home in on the nearest astronaut ---
let aliens = [];
let pendingAlienSpawns = 0;
let alienSpawnTimer = 0;

// --- Wave 5 boss: a mother ship hovering in the sky that releases aliens ---
let motherShip = null;
let motherShipWreck = null;
const MOTHERSHIP_MAX_HP = 45;

function spawnMotherShip(){
  const shipY = H * 0.25; // about a quarter of the way down from the top
  motherShip = {
    w: 140, h: 50, baseY: shipY,
    x: W/2 - 70, y: shipY,
    hp: MOTHERSHIP_MAX_HP, maxHp: MOTHERSHIP_MAX_HP,
    bob: 0, flash: 0, alive: true
  };
  motherShipWreck = null;
}

function getDangerZones(){
  // track how close the nearest active astronaut is to each edge, so spawns/landings
  // keep real clearance instead of just flipping which side they come from
  let rightX = null, leftX = null;
  astronauts.forEach(a=>{
    if(!a.alive || a.state !== 'active') return;
    if(rightX === null || a.x > rightX) rightX = a.x;
    if(leftX === null || a.x < leftX) leftX = a.x;
  });
  return { rightX, leftX };
}

function astronautsPastMidpoint(){
  // once any astronaut has made it to the middle of the screen, the right side is considered
  // "cleared" of ground threats -- new ground/side spawns must come from the left instead
  return astronauts.some(a=> a.alive && a.state !== 'done' && a.x >= W/2);
}

function spawnOneAlien(){
  const type = pickAlienType();
  const def = ALIEN_TYPES[type];
  const groundOnly = type === 'scout'; // green aliens always stay on the ground
  const airOnly = type === 'flyer' || type === 'saucer'; // flyers and saucers always come from the air
  const CLEARANCE = 200; // min horizontal gap to keep between a spawn/landing and any active astronaut

  if(wave % 5 === 0 && motherShip && motherShip.alive && !groundOnly){
    const zonesMs = getDangerZones();
    let mx = motherShip.x + motherShip.w/2 - def.w/2 + (Math.random()*40-20);
    if(zonesMs.rightX !== null && zonesMs.rightX > W-CLEARANCE) mx = Math.min(mx, zonesMs.rightX - CLEARANCE);
    if(zonesMs.leftX !== null && zonesMs.leftX < CLEARANCE) mx = Math.max(mx, zonesMs.leftX + CLEARANCE);
    aliens.push({
      type, entry:'mothership', landed:false,
      x: mx,
      y: motherShip.y + motherShip.h - 8,
      targetY: groundY - 20 - Math.random()*200,
      w: def.w, h: def.h,
      dir: Math.random() < 0.5 ? -1 : 1,
      speed: (0.5 + Math.random()*0.4 + wave*0.1) * def.speedMult * 0.5,
      hp: def.hp, maxHp: def.hp,
      alive:true, bob: Math.random()*Math.PI*2,
      flash: 0, state:'hunting', carrying:null
    });
    return;
  }

  const zones = getDangerZones();
  const fromSky = !groundOnly && (airOnly || Math.random() < 0.4);

  if(fromSky){
    // keep a wide default margin near both edges (especially the right, where astronauts exit)
    // so a falling alien can never just materialize right on top of someone
    let skyMinX = 60, skyMaxX = W-90;
    if(zones.rightX !== null && zones.rightX > W-CLEARANCE){
      skyMaxX = Math.min(skyMaxX, Math.max(skyMinX+40, zones.rightX - CLEARANCE));
    }
    if(zones.leftX !== null && zones.leftX < CLEARANCE){
      skyMinX = Math.max(skyMinX, Math.min(skyMaxX-40, zones.leftX + CLEARANCE));
    }
    if(skyMinX > skyMaxX){ skyMinX = skyMaxX = W/2; }
    aliens.push({
      type, entry:'sky', landed:false,
      x: skyMinX + Math.random()*(skyMaxX-skyMinX),
      y: -40 - Math.random()*120,
      targetY: groundY - 20 - Math.random()*200,
      w: def.w, h: def.h,
      dir: Math.random() < 0.5 ? -1 : 1,
      speed: (0.4 + Math.random()*0.4 + wave*0.1) * def.speedMult * 0.5,
      hp: def.hp, maxHp: def.hp,
      alive:true, bob: Math.random()*Math.PI*2,
      flash: 0, state:'hunting', carrying:null
    });
  } else {
    const pastMid = astronautsPastMidpoint();
    let spawnSide;
    if(pastMid){
      // right side is off-limits for ground/side spawns once astronauts have crossed the middle;
      // they can still come from above on the right (handled in the fromSky branch above)
      spawnSide = 'left';
    } else {
      spawnSide = Math.random() < 0.5 ? 'left' : 'right';
      const rightBlocked = zones.rightX !== null && zones.rightX > W-CLEARANCE;
      const leftBlocked = zones.leftX !== null && zones.leftX < CLEARANCE;
      if(rightBlocked && !leftBlocked) spawnSide = 'left';
      else if(leftBlocked && !rightBlocked) spawnSide = 'right';
    }
    const spawnX = spawnSide === 'right'
      ? W + 30 + Math.random()*200
      : -30 - Math.random()*200;
    aliens.push({
      type, entry:'side', landed:true,
      x: spawnX,
      y: groundY - 10 - Math.random()*220,
      w: def.w, h: def.h,
      dir: spawnSide === 'right' ? -1 : 1,
      speed: (0.6 + Math.random()*0.5 + wave*0.12) * def.speedMult * 0.5,
      hp: def.hp, maxHp: def.hp,
      alive:true, bob: Math.random()*Math.PI*2,
      flash: 0, state:'hunting', carrying:null
    });
  }
}

function queueAlienWave(){
  pendingAlienSpawns = 4 + wave;
  alienSpawnTimer = 15;
  motherShip = null;
  motherShipWreck = null;
  if(wave % 5 === 0){
    spawnMotherShip();
    pendingAlienSpawns += 4; // the boss wave sends out a few extra minions
  }
}

// --- Minerals ---
let minerals = [];
const MINERAL_TYPES = [
  { hue:190, value:8,  size:6,  weight:0.5  },
  { hue:320, value:20, size:8,  weight:0.32 },
  { hue:45,  value:40, size:10, weight:0.18 }
];
let mineralCounts = [0,0,0];
function pickMineralTypeIndex(){
  const r = Math.random();
  let acc = 0;
  for(let i=0;i<MINERAL_TYPES.length;i++){
    acc += MINERAL_TYPES[i].weight;
    if(r < acc) return i;
  }
  return 0;
}
function spawnMinerals(n){
  minerals = [];
  for(let i=0;i<n;i++){
    const idx = pickMineralTypeIndex();
    const type = MINERAL_TYPES[idx];
    minerals.push({
      x: 70 + Math.random()*(W-140), y: groundY + 8,
      taken:false, hue:type.hue, value:type.value, size:type.size, typeIndex:idx
    });
  }
}

// --- Planet theme: a new look every wave ---
let theme = null;
const MYTH_PLANET_NAMES = [
  'Zeus','Hera','Ares','Apollo','Artemis','Hades','Poseidon','Athena',
  'Hermes','Demeter','Hyperion','Cronus','Rhea','Selene','Helios','Nyx',
  'Eos','Nemesis','Persephone','Icarus','Orion','Phobos','Deimos','Triton',
  'Chiron','Freya','Odin','Loki','Thor','Baldr','Anubis','Osiris','Isis'
];
function randomPlanetName(){
  if(Math.random() < 0.55){
    return MYTH_PLANET_NAMES[Math.floor(Math.random()*MYTH_PLANET_NAMES.length)];
  }
  const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const l1 = letters[Math.floor(Math.random()*letters.length)];
  const l2 = letters[Math.floor(Math.random()*letters.length)];
  const num = Math.floor(Math.random()*900) + 100;
  return `${l1}${l2}-${num}`;
}

function randomPlanetTheme(){
  const hue = Math.floor(Math.random()*360);
  const hue2 = (hue + 25 + Math.random()*70) % 360;
  const groundHue = (hue + 50 + Math.random()*40) % 360;
  const hasMoon = Math.random() < 0.7;
  const hasMountains = true;
  // mountain height: anywhere from flat (0) up to the original maximum
  const mountainAmpFar = Math.random()*240;
  const mountainAmpNear = mountainAmpFar * (0.6 + Math.random()*0.25);
  const mountainFreqFar = 0.008 + Math.random()*0.01;
  const mountainFreqNear = 0.012 + Math.random()*0.014;
  const mountainPhaseFar = Math.random()*Math.PI*2;
  const mountainPhaseNear = Math.random()*Math.PI*2;

  // sky mood: pitch-black void, bright pastel daytime, or the moody dusk/night gradient
  const skyRoll = Math.random();
  let skyStops, starTint, showStars = true;
  if(skyRoll < 0.22){
    // pitch black void
    skyStops = [
      { off:0, color:`hsl(${hue},25%,2%)` },
      { off:0.5, color:`hsl(${hue},18%,4%)` },
      { off:1, color:`hsl(${hue},22%,7%)` }
    ];
    starTint = `hsla(${(hue+180)%360},65%,95%,`;
  } else if(skyRoll < 0.48){
    // bright pastel daytime
    skyStops = [
      { off:0, color:`hsl(${hue},58%,90%)` },
      { off:0.4, color:`hsl(${(hue+18)%360},60%,83%)` },
      { off:0.7, color:`hsl(${(hue+38)%360},55%,76%)` },
      { off:1, color:`hsl(${(hue+65)%360},50%,70%)` }
    ];
    starTint = `hsla(${(hue+180)%360},40%,100%,`;
    showStars = false;
  } else {
    // dusk / night gradient
    skyStops = [
      { off:0,    color:`hsl(${hue},55%,9%)` },
      { off:0.35, color:`hsl(${hue2},50%,18%)` },
      { off:0.68, color:`hsl(${(hue2+30)%360},50%,28%)` },
      { off:1,    color:`hsl(${(hue+70)%360},45%,38%)` }
    ];
    starTint = `hsla(${(hue+180)%360},60%,90%,`;
  }

  // scattered, non-repeating starfield
  const stars = [];
  const starCount = 42;
  const starAreaH = Math.max(80, groundY - 160);
  for(let i=0;i<starCount;i++){
    stars.push({
      x: Math.random()*W,
      y: Math.random()*starAreaH,
      phase: Math.random()*Math.PI*2,
      size: 1.4 + Math.random()*1.6
    });
  }

  // scattered ground texture (rocks/craters), varied per planet
  const groundDetails = [];
  const detailCount = 10 + Math.floor(Math.random()*10);
  for(let i=0;i<detailCount;i++){
    groundDetails.push({
      x: Math.random()*W,
      y: groundY + 8 + Math.random()*(H-groundY-18),
      rx: 6 + Math.random()*10,
      ry: 2.5 + Math.random()*4,
      alpha: 0.5 + Math.random()*0.5
    });
  }

  // moon: varied phase and tint, not always full or gray
  let moon = null;
  if(hasMoon){
    const moonHue = Math.floor(Math.random()*360);
    const sat = 8 + Math.random()*45;
    const light = 55 + Math.random()*35;
    moon = {
      color: `hsl(${moonHue},${sat}%,${light}%)`,
      shadowColor: `hsl(${moonHue},${Math.min(sat+10,60)}%,${Math.max(light-45,8)}%)`,
      craterColor: 'rgba(0,0,0,0.18)',
      glow: `hsla(${moonHue},${Math.min(sat+20,70)}%,${Math.min(light+10,90)}%,`,
      x: 30 + Math.random()*(W-60),
      y: 10 + Math.random()*(groundY-60),
      r: 11 + Math.random()*169,
      illum: 0.15 + Math.random()*0.8,
      dir: Math.random() < 0.5 ? 1 : -1
    };
  }

  return {
    name: randomPlanetName(),
    skyStops,
    showStars,
    hasMountains,
    mountainAmpFar, mountainAmpNear,
    mountainFreqFar, mountainFreqNear,
    mountainPhaseFar, mountainPhaseNear,
    mountainFar: `hsl(${hue},38%,14%)`,
    mountainNear: `hsl(${hue2},42%,21%)`,
    ground: `hsl(${groundHue},38%,24%)`,
    groundDetail: `hsl(${groundHue},38%,31%)`,
    starTint,
    stars,
    groundDetails,
    moon
  };
}

function initCrew(){
  crewRoster = [];
  for(let i=0;i<3;i++) addCrewMember();
  lives = crewRoster.length;
}

function resetGame(){
  score=0; wave=1; gameOver=false;
  lasers = [];
  mineralsCollected = 0;
  mineralCounts = [0,0,0];
  pendingCrewBonus = 0;
  bannerQueue = [];
  banner = null;
  abductedThisWave = [];
  gameStarted = false;
  transitioning = false;
  eliminateUnlocked = false;
  eliminateThreshold = ELIM_BTN_COST;
  initCrew();
  theme = randomPlanetTheme();
  updateHud();
  updateAbductedPanel();
  renderWaveIntro(0);
}

function prepareWave(){
  theme = randomPlanetTheme();
  newlyJoined = [];
  abductedThisWave = [];
  updateAbductedPanel();
  if(pendingCrewBonus > 0){
    for(let i=0;i<pendingCrewBonus && crewRoster.length < MAX_ASTRONAUTS; i++){
      newlyJoined.push(addCrewMember());
    }
    pendingCrewBonus = 0;
    lives = crewRoster.length;
  }
  gameStarted = false;
  updateHud();
  renderWaveIntro(0);
}
function updateHud(){
  scoreDisp.innerHTML = MINERAL_TYPES.map((t,i)=>{
    const px = 8 + t.size; // diamond icon scales with this type's in-world size (and value)
    return `<span class="mCount"><span class="mDot" style="width:${px}px;height:${px}px;background:hsl(${t.hue},90%,60%)"></span>${mineralCounts[i]}</span>`;
  }).join('');
  pointsDisp.textContent = 'Points: ' + score;
}

// --- Tap-to-shoot aliens ---
function getGamePos(clientX, clientY){
  const rect = canvas.getBoundingClientRect();
  const relX = (clientX - rect.left) / rect.width;
  const relY = (clientY - rect.top) / rect.height;
  return { x: relX * W, y: relY * H };
}

function eliminateAllAliens(){
  aliens.forEach(al=>{ al.alive = false; });
  eliminateUnlocked = false;
  eliminateThreshold += ELIM_BTN_COST; // needs another 250 points before it can rearm
  showBanner('ALL ALIENS ELIMINATED', '#ff6b6b', 90);
}

function tryShootAt(gx, gy){
  if(!gameStarted || gameOver || transitioning) return;
  if(eliminateUnlocked &&
     gx > ELIM_BTN.x && gx < ELIM_BTN.x+ELIM_BTN.w && gy > ELIM_BTN.y && gy < ELIM_BTN.y+ELIM_BTN.h){
    eliminateAllAliens();
    return;
  }
  let best = null, bestDist = Infinity, bestIsShip = false;
  const TAP_PAD = 22;
  aliens.forEach(al=>{
    if(!al.alive || al.state === 'abducting') return;
    const cx = al.x + al.w/2, cy = al.y + al.h/2;
    if(gx > al.x-TAP_PAD && gx < al.x+al.w+TAP_PAD && gy > al.y-TAP_PAD && gy < al.y+al.h+TAP_PAD){
      const d = Math.hypot(cx-gx, cy-gy);
      if(d < bestDist){ bestDist = d; best = al; bestIsShip = false; }
    }
  });
  if(motherShip && motherShip.alive){
    const cx = motherShip.x + motherShip.w/2, cy = motherShip.y + motherShip.h/2;
    if(gx > motherShip.x-TAP_PAD && gx < motherShip.x+motherShip.w+TAP_PAD && gy > motherShip.y-TAP_PAD && gy < motherShip.y+motherShip.h+TAP_PAD){
      const d = Math.hypot(cx-gx, cy-gy);
      if(d < bestDist){ bestDist = d; best = motherShip; bestIsShip = true; }
    }
  }
  if(best){
    best.hp -= 1;
    best.flash = 8;
    lasers.push({
      x1: module.x, y1: module.y - 20,
      x2: best.x + best.w/2, y2: best.y + best.h/2,
      life: 8
    });
    if(best.hp <= 0){
      best.alive = false;
      if(bestIsShip){
        score += 150;
        motherShipWreck = { x: best.x, y: best.y, w: best.w, h: best.h, timer: 30 };
      } else {
        score += ALIEN_TYPES[best.type].score;
        pendingAlienSpawns++; // defeating one brings another into the fight
      }
    }
  }
}

canvas.addEventListener('touchstart', e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    const p = getGamePos(t.clientX, t.clientY);
    tryShootAt(p.x, p.y);
  }
}, {passive:false});

canvas.addEventListener('mousedown', e=>{
  const p = getGamePos(e.clientX, e.clientY);
  tryShootAt(p.x, p.y);
});

window.addEventListener('keydown', e=>{
  if(gameOver && e.code==='Enter') resetGame();
});
msgBtn.addEventListener('click', resetGame);
msgBtn.addEventListener('touchend', e=>{ e.preventDefault(); resetGame(); });

// --- Update ---
function update(){
  if(!gameStarted) return;
  frame++;

  // keep any already-fleeing/scattering aliens animating even after the wave/mission has ended
  aliens.forEach(al=>{
    if(!al.alive) return;
    if(al.state === 'abducting'){
      if(al.flash > 0) al.flash--;
      al.y -= 2.6;
      al.x += al.dir * al.speed * 1.4;
      al.bob += 0.16;
      if(al.y < -70 || al.x < -100 || al.x > W+100) al.alive = false;
    } else if(al.state === 'scatter'){
      if(al.flash > 0) al.flash--;
      al.x += al.scatterVX;
      al.y += al.scatterVY;
      al.bob += 0.22;
      if(al.x < -100 || al.x > W+100 || al.y < -100 || al.y > H+100) al.alive = false;
    }
  });
  aliens = aliens.filter(al=> al.alive);

  // let the mother ship fly off screen if it's leaving at the end of its wave
  if(motherShip && motherShip.alive && motherShip.leaving){
    motherShip.bob += 0.05;
    motherShip.y -= 5;
    motherShip.x += Math.sin(motherShip.bob)*2;
    if(motherShip.y < -120) motherShip = null;
  }

  if(gameOver || transitioning) return;

  if(motherShip && motherShip.alive){
    motherShip.bob += 0.02;
    motherShip.x = W/2 - motherShip.w/2 + Math.sin(motherShip.bob)*50;
    motherShip.y = motherShip.baseY + Math.sin(motherShip.bob*1.7)*6;
    if(motherShip.flash > 0) motherShip.flash--;
  }
  if(motherShipWreck){
    motherShipWreck.timer--;
    if(motherShipWreck.timer <= 0) motherShipWreck = null;
  }

  if(pendingAlienSpawns > 0){
    alienSpawnTimer--;
    if(alienSpawnTimer <= 0){
      spawnOneAlien();
      pendingAlienSpawns--;
      alienSpawnTimer = 35 + Math.random()*55;
    }
  }

  lasers.forEach(l=> l.life--);
  lasers = lasers.filter(l=> l.life>0);

  if(banner){
    banner.timer--;
    if(banner.timer <= 0) banner = null;
  }
  if(!banner && bannerQueue.length){
    const nb = bannerQueue.shift();
    banner = { text: nb.text, color: nb.color, timer: nb.duration, max: nb.duration };
  }

  astronauts.forEach(a=>{
    if(!a.alive) return;
    if(a.state==='beamIn'){
      a.timer--;
      if(a.timer<=0){ a.state='active'; }
    } else if(a.state==='active'){
      a.x += a.speed;
      a.bob += 0.15;
      if(a.x >= W-40){ a.state='beamOut'; a.timer=BEAM_DURATION; }
    } else if(a.state==='beamOut'){
      a.timer--;
      a.bob += 0.15;
      if(a.timer<=0){ a.state='done'; a.safe=true; }
    }
  });

function findHomingTarget(al){
  let best = null, bestDist = Infinity;
  astronauts.forEach(a=>{
    if(!a.alive || a.state !== 'active') return;
    const d = Math.hypot((a.x+a.w/2) - (al.x+al.w/2), a.y - al.y);
    if(d < bestDist){ bestDist = d; best = a; }
  });
  return best;
}

  aliens.forEach(al=>{
    if(!al.alive) return;
    if(al.flash > 0) al.flash--;
    const def = ALIEN_TYPES[al.type];

    if(al.state === 'abducting') return; // already handled above, even through game over

    if((al.entry === 'sky' || al.entry === 'mothership') && !al.landed){
      al.y += 3.2;
      if(al.y >= al.targetY){ al.y = al.targetY; al.landed = true; }
      return;
    }

    al.bob += def.wavy ? 0.14 : 0.08;

    const target = findHomingTarget(al);
    if(target){
      const dx = (target.x + target.w/2) - (al.x + al.w/2);
      const dy = (target.y + target.h/2 - al.h/2) - al.y;
      const dist = Math.hypot(dx, dy) || 1;
      al.dir = dx >= 0 ? 1 : -1;
      al.x += (dx/dist) * al.speed;
      al.y += (dy/dist) * al.speed * 0.7;
    } else {
      al.x += al.speed * al.dir;
    }
    if(def.wavy) al.y += Math.sin(al.bob) * 1.0;
  });

  aliens.forEach(al=>{
    if(!al.alive || al.state === 'abducting' || ((al.entry === 'sky' || al.entry === 'mothership') && !al.landed)) return;
    astronauts.forEach(a=>{
      if(!a.alive || a.state!=='active') return;
      if(al.x < a.x+a.w && al.x+al.w > a.x && al.y < a.y+a.h && al.y+al.h > a.y){
        a.alive=false;
        al.state='abducting';
        al.carrying=a.name;
        removeCrewMember(a.name);
        lives = crewRoster.length;
        abductedThisWave.push(a.name);
        updateAbductedPanel();
      }
    });
    if((al.dir === -1 && al.x < -60) || (al.dir === 1 && al.x > W+60)) al.alive=false;
  });

  minerals.forEach(m=>{
    if(m.taken) return;
    astronauts.forEach(a=>{
      if(!a.alive || a.state!=='active' || m.taken) return;
      if(Math.abs((a.x+a.w/2)-m.x) < 16){
        m.taken=true;
        score += m.value;
        mineralCounts[m.typeIndex]++;
        const before = Math.floor(mineralsCollected/100);
        mineralsCollected += m.value;
        const after = Math.floor(mineralsCollected/100);
        if(after > before) pendingCrewBonus += (after-before);
      }
    });
  });

  aliens = aliens.filter(al=> al.alive);
  updateHud();

  if(lives<=0){ resolveMissionEnd(false); return; }

  const allResolved = astronauts.every(a=> a.state==='done' || !a.alive);
  if(allResolved){
    const anySafe = astronauts.some(a=>a.safe);
    if(anySafe){
      wave++;
      resolveWaveComplete();
    } else { resolveMissionEnd(false); return; }
  }
}

function scatterAliens(){
  // panic the survivors off in random directions rather than freezing them mid-scene
  const cx = W/2;
  aliens.forEach(al=>{
    if(!al.alive || al.state === 'abducting') return; // already has its own flee animation
    al.state = 'scatter';
    const awayDir = (al.x + al.w/2) < cx ? -1 : 1;
    const angle = Math.random()*0.7 - 0.35;
    const speed = 3 + Math.random()*2.5;
    al.scatterVX = Math.cos(angle) * speed * awayDir;
    al.scatterVY = Math.sin(angle) * speed - 1.8;
  });
}

function showInterstitial(text, color){
  interstitialTitle.textContent = text;
  interstitialTitle.style.color = color;
  interstitialBox.style.display = 'block';
}
function hideInterstitial(){
  interstitialBox.style.display = 'none';
}

function resolveWaveComplete(){
  transitioning = true;
  scatterAliens();
  lasers = [];
  // if the boss wave ended with the mother ship still alive, send it flying off screen too
  if(motherShip && motherShip.alive) motherShip.leaving = true;
  showInterstitial('Wave Complete!', '#7CFFB2');
  setTimeout(()=>{
    hideInterstitial();
    transitioning = false;
    motherShip = null;
    motherShipWreck = null;
    prepareWave();
  }, 2000);
}

function resolveMissionEnd(won){
  transitioning = true;
  scatterAliens();
  lasers = [];
  showInterstitial(won ? 'All Waves Cleared!' : 'Mission Failed', won ? '#7CFFB2' : '#ff6b6b');
  setTimeout(()=>{
    hideInterstitial();
    endGame(won);
  }, 2000);
}

function endGame(won){
  gameOver = true;
  if(won){
    msgTitle.textContent='Mission Complete!';
    msgTitle.style.color='#7CFFB2';
    msgBody.textContent = `All waves cleared! Final mineral count: ${mineralsCollected}. Tap Play Again to restart.`;
  } else {
    msgTitle.textContent='Mission Failed';
    msgTitle.style.color='#ff6b6b';
    msgBody.textContent = `The astronauts didn't make it. Minerals collected: ${mineralsCollected}. Tap Play Again to retry.`;
  }
  revealAfterDelay(()=>{ msgBox.style.display='block'; }, 0);
}

// --- Draw ---
function drawSky(){
  const grad = ctx.createLinearGradient(0,0,0,H);
  theme.skyStops.forEach(s=> grad.addColorStop(s.off, s.color));
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);
}

function drawMoon(){
  if(!theme.moon) return;
  const { x:mx, y:my, r, color, shadowColor, glow, craterColor, illum, dir } = theme.moon;
  ctx.save();
  const g = ctx.createRadialGradient(mx,my,r*0.6, mx,my,r*2.2);
  g.addColorStop(0, glow+'0.35)');
  g.addColorStop(1, glow+'0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(mx,my,r*2.2,0,Math.PI*2); ctx.fill();

  // base disc, then overlay an offset shadow disc to carve out the current phase
  ctx.save();
  ctx.beginPath(); ctx.arc(mx,my,r,0,Math.PI*2); ctx.clip();
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(mx,my,r,0,Math.PI*2); ctx.fill();
  const offsetX = illum * 2 * r * dir;
  ctx.fillStyle = shadowColor;
  ctx.beginPath(); ctx.arc(mx+offsetX,my,r,0,Math.PI*2); ctx.fill();
  ctx.restore();

  // craters, kept subtle so they read on both light and dark moons
  ctx.fillStyle = craterColor;
  ctx.beginPath(); ctx.arc(mx-r*0.3,my-r*0.25,r*0.18,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(mx+r*0.25,my+r*0.2,r*0.12,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(mx-r*0.1,my+r*0.35,r*0.1,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawHillsLayer(baseY, amp, color, freq, phase){
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(0, groundY+2);
  for(let x=0; x<=W; x+=12){
    const y = baseY - amp*Math.abs(Math.sin(x*freq+phase)) - amp*0.5*Math.sin(x*freq*2.1+phase*1.6);
    ctx.lineTo(x,y);
  }
  ctx.lineTo(W, groundY+2);
  ctx.closePath();
  ctx.fill();
}

function drawStars(){
  if(theme.showStars === false) return;
  ctx.save();
  ctx.shadowColor = theme.starTint + '1)';
  ctx.shadowBlur = 4;
  ctx.fillStyle = theme.starTint + '1)';
  theme.stars.forEach(s=>{
    ctx.globalAlpha = 0.65+0.35*Math.sin(frame*0.05+s.phase);
    ctx.fillRect(s.x, s.y, s.size, s.size);
  });
  ctx.restore();
  ctx.globalAlpha=1;
}

function drawGround(){
  ctx.fillStyle = theme.ground;
  ctx.fillRect(0, groundY+0, W, H-groundY-10);
  theme.groundDetails.forEach(d=>{
    ctx.globalAlpha = d.alpha;
    ctx.fillStyle = theme.groundDetail;
    ctx.beginPath();
    ctx.ellipse(d.x, d.y, d.rx, d.ry, 0, 0, Math.PI*2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
}

function drawBeam(a){
  let progress;
  if(a.state==='beamIn') progress = 1 - a.timer/BEAM_DURATION;
  else if(a.state==='beamOut') progress = a.timer/BEAM_DURATION;
  else return;
  const cx = a.x + a.w/2;
  const beamW = 26;
  ctx.save();
  const grad = ctx.createLinearGradient(cx, 0, cx, a.y);
  grad.addColorStop(0, 'rgba(120,225,255,0)');
  grad.addColorStop(0.55, `rgba(120,225,255,${0.45*progress})`);
  grad.addColorStop(1, `rgba(200,245,255,${0.85*progress})`);
  ctx.fillStyle = grad;
  ctx.fillRect(cx-beamW/2, 0, beamW, a.y);
  ctx.strokeStyle = `rgba(170,235,255,${0.8*progress})`;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.ellipse(cx, a.y, beamW/2*(1+(1-progress)*0.6), 6, 0, 0, Math.PI*2);
  ctx.stroke();
  ctx.restore();
}

function drawAstronaut(a){
  if(!a.alive || a.state==='done') return;
  let alpha = 1;
  if(a.state==='beamIn') alpha = 1 - a.timer/BEAM_DURATION;
  if(a.state==='beamOut') alpha = a.timer/BEAM_DURATION;
  drawBeam(a);
  const bobY = a.state==='active' ? Math.sin(a.bob)*2 : Math.sin(a.bob)*1;
  const walk = a.state==='active' ? Math.sin(a.bob*1.8) : 0;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(a.x, a.y+bobY-a.h+8);

  // backpack (trails behind, since they face right)
  ctx.fillStyle='#b9b9d8';
  ctx.fillRect(1, 11, 6, 11);

  // legs, staggered for a right-facing walk cycle
  ctx.fillStyle='#c9c9e8';
  ctx.fillRect(7 - walk*3, 22, 5, 8);
  ctx.fillRect(11 + walk*3, 22, 5, 8);

  // torso
  ctx.fillStyle='#f0f0fa';
  ctx.fillRect(6, 11, 11, 12);
  ctx.fillStyle='#3ad6ff';
  ctx.fillRect(9, 14, 4, 6);

  // arm hanging at the side, slight swing
  ctx.fillStyle='#e3e3f2';
  ctx.fillRect(14, 13 + walk*1.5, 4, 9);
  ctx.fillStyle='#3ad6ff';
  ctx.beginPath(); ctx.arc(16, 22 + walk*1.5, 2, 0, Math.PI*2); ctx.fill();

  // head, facing right
  ctx.fillStyle='#f0f0fa';
  ctx.beginPath(); ctx.arc(13,6,6,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#3ad6ff';
  ctx.beginPath(); ctx.ellipse(15,6.5,3.6,4,0,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.6)';
  ctx.lineWidth=1;
  ctx.beginPath(); ctx.arc(13,6,6,0,Math.PI*2); ctx.stroke();

  ctx.restore();
  ctx.globalAlpha=1;
}

function drawAlien(al){
  if(!al.alive) return;
  const def = ALIEN_TYPES[al.type];

  if((al.entry === 'sky' || al.entry === 'mothership') && !al.landed){
    ctx.save();
    const grad = ctx.createLinearGradient(al.x+al.w/2, al.y-40, al.x+al.w/2, al.y+al.h/2);
    grad.addColorStop(0, 'rgba(255,255,255,0)');
    grad.addColorStop(1, 'rgba(200,255,220,0.5)');
    ctx.fillStyle = grad;
    ctx.fillRect(al.x+al.w/2-3, al.y-40, 6, 40+al.h/2);
    ctx.restore();
  }

  ctx.save();
  ctx.translate(al.x, al.y);
  const bodyColor = al.flash > 0 ? '#ffffff' : def.color;

  // dark glow so aliens stand out against light backgrounds
  ctx.shadowColor = 'rgba(0,0,0,0.55)';
  ctx.shadowBlur = 14;

  if(al.type === 'brute'){
    // big hunched brute with horns
    ctx.fillStyle = bodyColor;
    ctx.beginPath();
    ctx.ellipse(al.w/2, al.h/2+2, al.w/2, al.h/2, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = def.dark;
    ctx.beginPath();
    ctx.moveTo(al.w*0.2, al.h*0.25); ctx.lineTo(al.w*0.05,0); ctx.lineTo(al.w*0.35,al.h*0.2); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(al.w*0.8, al.h*0.25); ctx.lineTo(al.w*0.95,0); ctx.lineTo(al.w*0.65,al.h*0.2); ctx.fill();
    ctx.fillStyle = '#ffe';
    ctx.beginPath(); ctx.arc(al.w/2-9, al.h/2, 3.5, 0, Math.PI*2); ctx.arc(al.w/2+9, al.h/2, 3.5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#200';
    ctx.beginPath(); ctx.arc(al.w/2-9, al.h/2, 1.6, 0, Math.PI*2); ctx.arc(al.w/2+9, al.h/2, 1.6, 0, Math.PI*2); ctx.fill();
  } else if(al.type === 'flyer'){
    // small darting flyer with wings
    ctx.fillStyle = 'rgba(255,224,102,0.5)';
    const wing = Math.sin(al.bob*2)*6;
    ctx.beginPath(); ctx.ellipse(al.w/2-10, al.h/2+wing, 8, 4, 0.4, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(al.w/2+10, al.h/2-wing, 8, 4, -0.4, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = bodyColor;
    ctx.beginPath(); ctx.ellipse(al.w/2, al.h/2, al.w/2*0.7, al.h/2, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#3a2c00';
    ctx.beginPath(); ctx.arc(al.w/2, al.h/2-1, 3, 0, Math.PI*2); ctx.fill();
  } else if(al.type === 'spitter'){
    // purple many-legged crawler: oval body with 8 jointed legs radiating from underneath
    const legCount = 8;
    ctx.strokeStyle = bodyColor;
    ctx.lineWidth = 2;
    for(let i=0;i<legCount;i++){
      const angle = Math.PI*0.08 + (i/(legCount-1))*Math.PI*0.84;
      const wig = Math.sin(al.bob*3 + i)*0.14;
      const a2 = angle + wig;
      const originX = al.w/2 + Math.cos(a2)*al.w*0.26;
      const originY = al.h/2 + Math.sin(a2)*al.h*0.2;
      const kneeX = al.w/2 + Math.cos(a2)*al.w*0.48;
      const kneeY = al.h/2 + Math.sin(a2)*al.h*0.42;
      const endX = al.w/2 + Math.cos(a2)*al.w*0.62;
      const endY = al.h*0.92;
      ctx.beginPath();
      ctx.moveTo(originX, originY);
      ctx.quadraticCurveTo(kneeX, kneeY, endX, endY);
      ctx.stroke();
    }
    ctx.fillStyle = bodyColor;
    ctx.beginPath();
    ctx.ellipse(al.w/2, al.h/2, al.w*0.36, al.h*0.34, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = def.dark;
    ctx.beginPath(); ctx.ellipse(al.w/2, al.h*0.62, al.w*0.2, al.h*0.16, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#f0e6ff';
    ctx.beginPath(); ctx.arc(al.w/2-6, al.h/2-4, 3, 0, Math.PI*2); ctx.arc(al.w/2+6, al.h/2-4, 3, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = def.dark;
    ctx.beginPath(); ctx.arc(al.w/2-6, al.h/2-4, 1.4, 0, Math.PI*2); ctx.arc(al.w/2+6, al.h/2-4, 1.4, 0, Math.PI*2); ctx.fill();
  } else if(al.type === 'saucer'){
    // classic flying saucer: a wide disc with a glowing dome and blinking rim lights
    const cx = al.w/2, cy = al.h/2;
    ctx.fillStyle = def.dark;
    ctx.beginPath(); ctx.ellipse(cx, cy+3, al.w/2, al.h*0.3, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = bodyColor;
    ctx.beginPath(); ctx.ellipse(cx, cy, al.w/2, al.h*0.38, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(220,245,255,0.85)';
    ctx.beginPath(); ctx.ellipse(cx, cy-al.h*0.28, al.w*0.22, al.h*0.32, 0, Math.PI, Math.PI*2); ctx.fill();
    for(let i=0;i<5;i++){
      const lx = cx - al.w*0.36 + i*(al.w*0.72/4);
      const lit = Math.sin(al.bob*3 + i) > 0.2;
      ctx.fillStyle = lit ? '#fffbe0' : 'rgba(255,251,224,0.25)';
      ctx.beginPath(); ctx.arc(lx, cy+3, 1.8, 0, Math.PI*2); ctx.fill();
    }
  } else {
    // scout - simple quick alien with tentacles
    ctx.fillStyle = bodyColor;
    ctx.beginPath();
    ctx.ellipse(al.w/2, al.h/2, al.w/2, al.h/2, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = def.dark;
    ctx.beginPath();
    ctx.arc(al.w/2-7, al.h/2-2, 3, 0, Math.PI*2);
    ctx.arc(al.w/2+7, al.h/2-2, 3, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = def.color;
    ctx.lineWidth = 2;
    for(let i=-1;i<=1;i++){
      ctx.beginPath();
      ctx.moveTo(al.w/2+i*8, al.h);
      ctx.lineTo(al.w/2+i*8+Math.sin(al.bob+i)*3, al.h+8);
      ctx.stroke();
    }
  }

  ctx.shadowBlur = 0;
  ctx.shadowColor = 'transparent';

  // hp pips for multi-hit aliens
  if(al.maxHp > 1 && al.state !== 'abducting'){
    for(let i=0;i<al.maxHp;i++){
      ctx.fillStyle = i < al.hp ? '#fff' : 'rgba(255,255,255,0.25)';
      ctx.fillRect(al.w/2 - (al.maxHp*6)/2 + i*6, -8, 4, 3);
    }
  }

  // captured astronaut, dangling below on a tether while the alien flees
  if(al.state === 'abducting'){
    const swing = Math.sin(al.bob) * 5;
    const px = al.w/2 + swing;
    const py = al.h + 16;
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(al.w/2, al.h-2); ctx.lineTo(px, py-6); ctx.stroke();
    ctx.fillStyle = '#f0f0fa';
    ctx.fillRect(px-4, py-6, 8, 9);
    ctx.beginPath(); ctx.arc(px, py-9, 4.5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#3ad6ff';
    ctx.beginPath(); ctx.arc(px, py-9, 3, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#c9c9e8';
    ctx.fillRect(px-4, py+2, 3, 5);
    ctx.fillRect(px+1, py+2, 3, 5);
  }

  ctx.restore();
}

function drawMineral(m){
  if(m.taken) return;
  const s = m.size || 6;
  ctx.save();
  ctx.translate(m.x, m.y);
  ctx.fillStyle = `hsl(${m.hue},90%,60%)`;
  ctx.beginPath();
  ctx.moveTo(0,-s); ctx.lineTo(s,0); ctx.lineTo(0,s); ctx.lineTo(-s,0);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.7)';
  ctx.stroke();
  ctx.restore();
}

function drawLasers(){
  lasers.forEach(l=>{
    const dx = l.x2-l.x1, dy = l.y2-l.y1;
    const len = Math.hypot(dx,dy) || 1;
    const nx = -dy/len, ny = dx/len;
    const wideHalf = 7;   // half-width at the bottom (origin)
    const narrowHalf = 1.5; // half-width at the top (target)
    ctx.fillStyle = `rgba(80,180,255,${l.life/8})`;
    ctx.beginPath();
    ctx.moveTo(l.x1 - nx*wideHalf, l.y1 - ny*wideHalf);
    ctx.lineTo(l.x1 + nx*wideHalf, l.y1 + ny*wideHalf);
    ctx.lineTo(l.x2 + nx*narrowHalf, l.y2 + ny*narrowHalf);
    ctx.lineTo(l.x2 - nx*narrowHalf, l.y2 - ny*narrowHalf);
    ctx.closePath();
    ctx.fill();
  });
}

function wrapText(text, maxWidth){
  const words = text.split(' ');
  const lines = [];
  let line = '';
  words.forEach(w=>{
    const test = line ? line + ' ' + w : w;
    if(ctx.measureText(test).width > maxWidth && line){
      lines.push(line);
      line = w;
    } else {
      line = test;
    }
  });
  if(line) lines.push(line);
  return lines;
}

function drawBanner(){
  if(!banner) return;
  const t = banner.timer, max = banner.max;
  let alpha = 1;
  if(t > max-15) alpha = (max-t)/15;
  else if(t < 25) alpha = t/25;

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.font = 'bold 19px -apple-system, "Helvetica Neue", Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const maxTextWidth = W - 60;
  const lines = wrapText(banner.text, maxTextWidth);
  const lineH = 24;
  const boxW = Math.min(W - 20, Math.max(...lines.map(l=>ctx.measureText(l).width)) + 32);
  const boxH = lines.length * lineH + 14;
  const boxY = 88;

  ctx.fillStyle = 'rgba(8,3,16,0.85)';
  ctx.fillRect(W/2 - boxW/2, boxY, boxW, boxH);
  ctx.strokeStyle = banner.color;
  ctx.lineWidth = 2;
  ctx.strokeRect(W/2 - boxW/2, boxY, boxW, boxH);
  ctx.fillStyle = banner.color;
  ctx.shadowColor = banner.color;
  ctx.shadowBlur = 8;
  lines.forEach((l,i)=>{
    ctx.fillText(l, W/2, boxY + 14 + i*lineH + lineH/2);
  });
  ctx.restore();
}

function drawAtomIcon(cx, cy, active){
  // classic atomic-energy symbol: a nucleus dot with three tilted electron orbits
  ctx.save();
  ctx.translate(cx, cy);
  const orbitColor = active ? '#3a0505' : '#6a6078';
  ctx.strokeStyle = orbitColor;
  ctx.lineWidth = 1.3;
  const rx = 10, ry = 3.6;
  for(let i=0;i<3;i++){
    ctx.save();
    ctx.rotate(i * Math.PI/3);
    ctx.beginPath();
    ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }
  ctx.fillStyle = orbitColor;
  ctx.beginPath();
  ctx.arc(0, 0, 2.2, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function drawTopBar(){
  // a bar at the top matching the bottom console's look; the mineral-count and points
  // HUD chips (DOM) sit on top of it
  ctx.save();
  const topH = TOP_BAR_H;
  const grad = ctx.createLinearGradient(0, 0, 0, topH);
  grad.addColorStop(0, '#2a1f3d');
  grad.addColorStop(1, '#120a1f');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, topH);
  ctx.strokeStyle = '#7d5ba6';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, topH); ctx.lineTo(W, topH);
  ctx.stroke();
  ctx.restore();
}

function drawModule(){
  // Player's viewpoint: console/HUD along the bottom, shots originate from directly below the view.
  ctx.save();
  const consoleH = CONSOLE_H;
  const grad = ctx.createLinearGradient(0, H-consoleH, 0, H);
  grad.addColorStop(0, '#2a1f3d');
  grad.addColorStop(1, '#120a1f');
  ctx.fillStyle = grad;
  ctx.fillRect(0, H-consoleH, W, consoleH);
  ctx.strokeStyle = '#7d5ba6';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, H-consoleH); ctx.lineTo(W, H-consoleH);
  ctx.stroke();

  // emergency purge button, far left of the console, aligned with the lights row
  const btn = ELIM_BTN;
  const lightsY = btn.y + btn.h/2;
  const btnActive = eliminateUnlocked;
  const btnR = btn.w/2, btnCx = btn.x+btnR, btnCy = btn.y+btnR;
  ctx.beginPath();
  ctx.arc(btnCx, btnCy, btnR, 0, Math.PI*2);
  if(btnActive){
    const pulse = 0.6 + 0.4*Math.sin(frame*0.15);
    ctx.fillStyle = `rgba(255,${Math.floor(60+40*pulse)},${Math.floor(60+40*pulse)},0.9)`;
  } else {
    ctx.fillStyle = 'rgba(60,50,75,0.7)';
  }
  ctx.fill();
  ctx.strokeStyle = btnActive ? '#ffb3b3' : '#4a3f5c';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.fillStyle = btnActive ? '#3a0505' : '#6a6078';
  drawAtomIcon(btn.x+btn.w/2, btn.y+btn.h/2, btnActive);

  // blinking console lights, shifted right of the purge button
  const lightsStartX = btn.x+btn.w+30, lightsSpacing = 22, lightsCount = 6;
  for(let i=0;i<lightsCount;i++){
    const lit = Math.sin(frame*0.1 + i) > 0.2;
    ctx.fillStyle = lit ? '#7CFFB2' : '#2f2440';
    ctx.beginPath();
    ctx.arc(lightsStartX + i*lightsSpacing, lightsY, 4, 0, Math.PI*2);
    ctx.fill();
  }

  // wave / planet readout: wave far left, planet far right, above the lights row
  // match the visual size of the "Points" HUD text (16px CSS), converted into canvas units
  const domFontPx = 16 * H / (canvas.clientHeight || H);
  ctx.fillStyle = '#cfc3ff';
  ctx.font = `bold ${domFontPx.toFixed(1)}px sans-serif`;
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';
  ctx.fillText('Wave ' + wave, 10, H-consoleH+16);
  if(theme){
    ctx.textAlign = 'right';
    ctx.fillText('Planet ' + theme.name, W-10, H-consoleH+16);
  }
  ctx.restore();

  // cockpit window frame corners (viewport HUD)
  ctx.save();
  ctx.strokeStyle = 'rgba(168,107,255,0.55)';
  ctx.lineWidth = 3;
  const cLen = 22, pad = 8;
  ctx.beginPath(); ctx.moveTo(pad, pad+cLen); ctx.lineTo(pad,pad); ctx.lineTo(pad+cLen,pad); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W-pad-cLen, pad); ctx.lineTo(W-pad,pad); ctx.lineTo(W-pad,pad+cLen); ctx.stroke();
  ctx.restore();
}

function drawMotherShip(){
  if(motherShipWreck){
    const t = motherShipWreck.timer / 30;
    ctx.save();
    ctx.globalAlpha = t;
    const cx = motherShipWreck.x + motherShipWreck.w/2, cy = motherShipWreck.y + motherShipWreck.h/2;
    ctx.strokeStyle = '#ffd166';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(cx, cy, (1-t)*70 + 10, 0, Math.PI*2);
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,150,80,0.5)';
    ctx.beginPath();
    ctx.arc(cx, cy, (1-t)*40, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
  if(!motherShip || !motherShip.alive) return;

  ctx.save();
  ctx.translate(motherShip.x, motherShip.y);
  const w = motherShip.w, h = motherShip.h;

  // under-glow where minions emerge
  const glow = ctx.createRadialGradient(w/2,h,4, w/2,h,50);
  glow.addColorStop(0, 'rgba(150,255,180,0.5)');
  glow.addColorStop(1, 'rgba(150,255,180,0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(w/2, h, 50, 0, Math.PI*2); ctx.fill();

  // hull
  const bodyColor = motherShip.flash > 0 ? '#ffffff' : '#8a8fa8';
  ctx.fillStyle = bodyColor;
  ctx.beginPath();
  ctx.ellipse(w/2, h*0.55, w/2, h*0.32, 0, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = motherShip.flash > 0 ? '#eeeeee' : '#5c6078';
  ctx.beginPath();
  ctx.ellipse(w/2, h*0.62, w/2*0.92, h*0.22, 0, 0, Math.PI*2);
  ctx.fill();

  // dome
  ctx.fillStyle = 'rgba(120,220,255,0.75)';
  ctx.beginPath();
  ctx.ellipse(w/2, h*0.32, w*0.22, h*0.28, 0, Math.PI, 0);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // rim lights
  for(let i=0;i<7;i++){
    const lx = w*0.1 + i*(w*0.8/6);
    const lit = Math.sin(frame*0.15 + i) > 0;
    ctx.fillStyle = lit ? '#7CFFB2' : '#33384a';
    ctx.beginPath(); ctx.arc(lx, h*0.58, 3, 0, Math.PI*2); ctx.fill();
  }

  ctx.restore();

  // HP bar
  ctx.save();
  const barW = w * 0.9, barX = motherShip.x + (w-barW)/2, barY = motherShip.y - 14;
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(barX, barY, barW, 8);
  ctx.fillStyle = '#ff6b6b';
  ctx.fillRect(barX, barY, barW * (motherShip.hp/motherShip.maxHp), 8);
  ctx.strokeStyle = 'rgba(255,255,255,0.6)';
  ctx.lineWidth = 1;
  ctx.strokeRect(barX, barY, barW, 8);
  ctx.restore();
}

function draw(){
  ctx.save();
  ctx.setTransform(scaleX, 0, 0, scaleY, 0, 0);
  ctx.clearRect(0,0,W,H);
  if(!theme) theme = randomPlanetTheme();
  drawSky();
  drawStars();
  drawMoon();
  if(theme.hasMountains){
    drawHillsLayer(groundY-40, theme.mountainAmpFar, theme.mountainFar, theme.mountainFreqFar, theme.mountainPhaseFar);
    drawHillsLayer(groundY-10, theme.mountainAmpNear, theme.mountainNear, theme.mountainFreqNear, theme.mountainPhaseNear);
  }
  drawGround();
  minerals.forEach(drawMineral);
  astronauts.forEach(drawAstronaut);
  drawMotherShip();
  aliens.forEach(drawAlien);
  drawLasers();
  drawTopBar();
  drawModule();
  drawBanner();
  ctx.restore();
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

resizeCanvas();
resetGame();
loop();
</script>
