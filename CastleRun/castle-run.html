<title>Castle Run</title>

<style>
/* Night scene: the page stays dark in both themes. */
:root{--bg:#0a0f22;--panel:#17213d;--edge:#34508f;--ink:#e8ecff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0f22;--panel:#17213d;--edge:#34508f;--ink:#e8ecff}}
:root[data-theme="dark"]{--bg:#0a0f22;--panel:#17213d;--edge:#34508f;--ink:#e8ecff}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Pixelify Sans",ui-monospace,monospace}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
canvas{display:block;width:min(100vw,calc((100dvh - 96px)*9/16));aspect-ratio:9/16;image-rendering:pixelated;background:#000;border:2px solid #24345f;box-sizing:border-box;touch-action:none}
#pad{display:flex;justify-content:space-between;width:min(100vw,640px);padding:0 14px;box-sizing:border-box}
.grp{display:flex;gap:10px}
.b{min-width:64px;height:60px;padding:0 12px;border-radius:12px;border:2px solid var(--edge);background:var(--panel);color:var(--ink);font:inherit;font-size:20px;user-select:none;-webkit-user-select:none;touch-action:none}
.b:active{background:#24386b}
.b:focus-visible{outline:2px solid #f2b84b;outline-offset:2px}
@media (hover:hover) and (pointer:fine){#pad{display:none}canvas{width:min(100vw,calc((100dvh - 24px)*9/16))}}
</style>
</head>

addEventListener('keyup',e=>{const k=map[e.code];if(k)inp[k]=0});
document.querySelectorAll('.b').forEach(b=>{const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault();inp[k]=1;start()});

let state='title',endT=0,tick=0,cam=0,camI=0,P,gems,foes,ghosts,bats,fbs,got,lvl=0,why='',parts=[],openT=-1;
function reset(){
  P={x:60,y:149,w:22,h:43,vx:0,vy:0,face:1,on:false,coy:0,buf:0,atk:0,hp:3,inv:0,stun:0,t:0,cp:CPS[0],step:true};
  gems=GEMS.map((a,i)=>({x:a[0],y:a[1],k:i%6,t:false}));got=0;openT=-1;parts=[];
  foes=EN.map(a=>({x:a[0],y:a[1],a:a[2],b:a[3],vx:1,w:22,h:40,dead:false}));
  ghosts=GH.map(a=>({x:a[0],by:a[1],y:a[1],a:a[2],b:a[3],vx:1.1,w:34,h:34,ph:a[0]%7,dead:false}));
  bats=BT.map(a=>({x:a[0],by:a[1],y:a[1],a:a[2],b:a[3],vx:.6,hp:1,cd:120+a[0]%60,atk:0,hc:0,fl:0,f:1,ph:a[0]%9,w:40,h:28,dead:false}));fbs=[];if(!S.includes(DOOR.r))S.push(DOOR.r);DOOR.open=0;cam=0;
}
function start(){
  if(state==='title')state='play';
  else if((state==='over'||state==='win')&&endT>40){if(state==='win'){lvl=(lvl+1)%LEVELS.length;setLevel(lvl)}reset();state='play'}
}

/* ---------- physics ---------- */
const hit=(o,s)=>o.x<s[0]+s[2]&&o.x+o.w>s[0]&&o.y<s[1]+s[3]&&o.y+o.h>s[1];
const ov=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function moveX(o,dx){
  o.x+=dx;
  for(const s of S){if(s[4]===5||!hit(o,s))continue;
    if(o.step&&o.on&&o.y+o.h-s[1]<=22){const oy=o.y;o.y=s[1]-o.h;if(!S.some(t=>t[4]!==5&&hit(o,t)))continue;o.y=oy}
    if(dx>0)o.x=s[0]-o.w;else if(dx<0)o.x=s[0]+s[2];o.vx=0}
}
function moveY(o,dy){
  o.y+=dy;o.on=false;
  for(const s of S){if(!hit(o,s))continue;
    if(s[4]===5&&!(dy>0&&o.y+o.h-dy<=s[1]+.01))continue;
    if(dy>0){o.y=s[1]-o.h;o.on=true}else if(dy<0){o.y=s[1]+s[3]}o.vy=0}
}
function burst(x,y,c,n){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*4,vy:-Math.random()*3.5,l:24+Math.random()*12,c})}
function hurt(){
  if(P.inv>0)return;
  P.hp--;P.inv=90;P.stun=14;P.vx=-P.face*4;P.vy=-5;burst(P.x+11,P.y+20,'#e0402f',10);
  if(P.hp<=0){state='over';endT=0;why='hit'}
}
function play(){
  const p=P,ax=inp.r-inp.l;
  if(p.stun>0){p.stun--;p.vx*=.92}else{p.vx+=(ax*3-p.vx)*.3;if(ax)p.face=ax}
  if(inp.j&&!prev.j)p.buf=7;
  p.coy=p.on?7:p.coy-1;
  if(p.buf>0&&p.coy>0){p.vy=-8.8;p.buf=0;p.coy=0;p.on=false}
  p.buf--;
  if(!inp.j&&p.vy<-3.5)p.vy=-3.5;
  if(inp.a&&!prev.a&&p.atk<=0)p.atk=20;
  if(p.atk>0)p.atk--;
  p.vy=Math.min(p.vy+.55,12);
  moveX(p,p.vx);moveY(p,p.vy);
  p.t+=Math.abs(p.vx);if(p.inv>0)p.inv--;
  for(const c of CPS)if(p.x>c[0])p.cp=c;
  if(p.y>WH+60){
    p.hp--;
    if(p.hp<=0){state='over';endT=0;why='fall'}
    else{p.x=p.cp[0];p.y=p.cp[1];p.vx=p.vy=0;p.inv=60;cam=Math.max(0,p.x-W/2)}
  }
  for(const q of gems)if(!q.t&&Math.abs(p.x+11-q.x)<22&&Math.abs(p.y+20-q.y)<26){q.t=true;got++;burst(q.x,q.y,GC[q.k],8)}
  const sw={x:p.face>0?p.x+p.w-4:p.x-40,y:p.y+4,w:44,h:34},swing=p.atk<=13&&p.atk>=5;
  for(const e of foes){if(e.dead)continue;
    e.x+=e.vx;
    if(e.x<e.a){e.x=e.a;e.vx=Math.abs(e.vx)}else if(e.x>e.b){e.x=e.b;e.vx=-Math.abs(e.vx)}
    if(swing&&ov(sw,e)){e.dead=true;burst(e.x+11,e.y+20,'#e6e6dc',12);continue}
    if(ov(p,e)){
      if(p.vy>1&&p.y+p.h-e.y<22){e.dead=true;p.vy=-7;burst(e.x+11,e.y+20,'#e6e6dc',12)}
      else hurt()}
  }
  for(const o of ghosts){if(o.dead)continue;
    o.x+=o.vx;if(o.x<o.a){o.x=o.a;o.vx=Math.abs(o.vx)}else if(o.x>o.b){o.x=o.b;o.vx=-Math.abs(o.vx)}
    o.y=o.by+Math.sin(tick*.05+o.ph)*16;
    if(swing&&ov(sw,o)){o.dead=true;burst(o.x+17,o.y+17,'#bfe3ff',14)}else if(ov(p,o))hurt()}
  for(const o of bats){if(o.dead)continue;
    o.x+=o.vx;if(o.x<o.a){o.x=o.a;o.vx=Math.abs(o.vx)}else if(o.x>o.b){o.x=o.b;o.vx=-Math.abs(o.vx)}
    o.y=o.by+Math.sin(tick*.04+o.ph)*14;o.f=p.x<o.x?-1:1;
    if(o.cd>0)o.cd--;if(o.atk>0)o.atk--;if(o.hc>0)o.hc--;if(o.fl>0)o.fl--;
    const dx=p.x+11-(o.x+20),dy=p.y+20-(o.y+14),d=Math.hypot(dx,dy)||1;
    if(o.cd<=0&&Math.abs(dx)<190&&Math.abs(dy)<140){o.cd=240;o.atk=18;fbs.push({x:o.x+20+o.f*20,y:o.y+14,vx:dx/d*1.8,vy:dy/d*1.8,l:170})}
    if(swing&&o.hc<=0&&ov(sw,o)){o.hp--;o.hc=14;o.fl=8;burst(o.x+20,o.y+14,'#ff6a3a',8);if(o.hp<=0){o.dead=true;burst(o.x+20,o.y+14,'#ff9a2a',18)}}
    else if(ov(p,o))hurt()}
  for(const f of fbs){f.x+=f.vx;f.y+=f.vy;f.l--;const b={x:f.x-8,y:f.y-8,w:16,h:16};
    if(S.some(s=>s[4]!==5&&hit(b,s))||f.l<=0)f.l=0;
    else if(swing&&ov(sw,b)){f.l=0;burst(f.x,f.y,'#ffb040',8)}
    else if(ov(p,b)){f.l=0;hurt()}}
  fbs=fbs.filter(f=>f.l>0);
  if(!DOOR.open&&Math.abs(p.x+11-DOOR.cx)<28&&p.y+p.h>150){DOOR.open=1;DOOR.t=tick;S.splice(S.indexOf(DOOR.r),1)}
  if(openT<0&&ov(p,CH)){openT=tick;burst(CH.x+21,CH.y,'#f2b84b',28)}
  if(state==='play'&&Math.abs(p.x+11-EXITX)<12&&p.y+p.h<=118){state='win';endT=0}
  cam+=(Math.max(0,Math.min(LW-W,p.x+11-W/2+p.face*40))-cam)*.12;
}
function upd(){
  tick++;
  if(state==='play')play();else{endT++;if(state==='over'&&why==='hit'){P.vx*=.9;P.vy=Math.min(P.vy+.55,12);moveX(P,P.vx);moveY(P,P.vy)}}
  for(const q of parts){q.x+=q.vx;q.y+=q.vy;q.vy+=.2;q.l--}
  parts=parts.filter(q=>q.l>0);
  prev.j=inp.j;prev.a=inp.a;
}

const HEART=['.XX.XX.','XXXXXXX','XXXXXXX','.XXXXX.','..XXX..','...X...'];
function heart(x,y,c){g.fillStyle=c;HEART.forEach((row,j)=>{for(let i=0;i<7;i++)if(row[i]==='X')g.fillRect(x+i*3,y+j*3,3,3)})}
function drawFoe(e){spr(g,'sk'+((tick>>3)%7),Math.round(e.x-camI)+11,Math.round(e.y)+40,e.vx<0)}
function draw(){

  g.drawImage(skyC,-(camI*.25|0),0);

  g.save();g.translate(0,OY);for(const t of torches){const sx=t-wo;if(sx<-90||sx>W+90)continue;

    const rg=g.createRadialGradient(sx,128,0,sx,128,80);rg.addColorStop(0,'rgba(255,160,50,.32)');rg.addColorStop(1,'rgba(255,160,50,0)');
    g.fillStyle=rg;g.fillRect(sx-80,48,160,160);g.globalCompositeOperation='source-over';
    spr(g,'flame',sx,138+Math.round(Math.sin(tick*.3+t)*1.5))}
  g.restore();
  g.drawImage(fgC,-camI,0);
  g.save();g.translate(0,OY);
  {const nk=LV.nook[0];g.save();g.beginPath();g.rect(nk[0]-camI,nk[1],nk[2],FL-nk[1]);g.clip();
  for(const x of LV.nt){const sx=x-camI;
    g.globalCompositeOperation='lighter';const rg=g.createRadialGradient(sx,166,0,sx,166,64);rg.addColorStop(0,'rgba(255,160,50,.4)');rg.addColorStop(1,'rgba(255,160,50,0)');g.fillStyle=rg;g.fillRect(sx-64,102,128,128);g.globalCompositeOperation='source-over';
    const f=SP.flame,fy=172+Math.round(Math.sin(tick*.3+x));g.drawImage(IM.flame,Math.round(sx-f.ax*.75),Math.round(fy-f.h*.75),Math.round(f.w*.75),Math.round(f.h*.75))}
  g.restore()}
  {const nk=LV.nook[0],a=DOOR.open?Math.max(0,1-(tick-DOOR.t)/24):1;
   if(a>0){g.globalAlpha=a;g.drawImage(coverC,nk[0]-camI,nk[1]);g.globalAlpha=1}}
  spr(g,'exit',EXITX-camI,116);
  spr(g,DOOR.open?'dr1':'dr0',DOOR.cx-camI-(DOOR.open?12:0),GY,DOOR.open);
  const ct=openT<0?'chest0':(tick-openT<18?'chest1':'chest2');
  spr(g,ct,CH.x+21-camI,CH.y+CH.h);
  for(const q of gems){if(q.t||(!DOOR.open&&q.y>200&&q.x<DOOR.cx))continue;spr(g,'gem'+q.k,Math.round(q.x-camI),Math.round(q.y+Math.sin(tick*.08+q.x)*3+SP['gem'+q.k].h/2))}
  for(const e of foes)if(!e.dead)drawFoe(e);
  g.globalAlpha=.88;for(const o of ghosts)if(!o.dead)spr(g,'gh'+[0,1,2,3,2,1][(tick>>3)%6],Math.round(o.x-camI)+17,Math.round(o.y)+17+SP.gh0.h/2,o.vx<0);g.globalAlpha=1;
  for(const o of bats){if(o.dead||(o.fl&1))continue;const n=o.atk>0?'ba':'bt'+((tick>>2)%8);spr(g,n,Math.round(o.x+20-camI),Math.round(o.y+14+SP[n].h/2),o.f<0)}
  g.globalCompositeOperation='lighter';
  for(const f of fbs){const x=Math.round(f.x-camI),y=Math.round(f.y),rg=g.createRadialGradient(x,y,0,x,y,22);rg.addColorStop(0,'rgba(255,150,40,.5)');rg.addColorStop(1,'rgba(255,150,40,0)');g.fillStyle=rg;g.fillRect(x-22,y-22,44,44)}
  g.globalCompositeOperation='source-over';
  for(const f of fbs)g.drawImage(IM.fb,Math.round(f.x-camI-SP.fb.w/2),Math.round(f.y-SP.fb.h/2));
  const p=P;
  if(state==='over'&&why==='hit')spr(g,'kdie',p.x+11-camI,p.y+p.h,p.face<0);
  else if(!(p.inv>0&&(p.inv>>2)%2)){
    let n='k_idle';
    if(p.atk>0)n=p.atk>13?'k_wind':'k_slash';else if(!p.on)n='kju';else if(Math.abs(p.vx)>.8)n='kw'+(3+((p.t/11|0)%4));
    spr(g,n,p.x+11-camI,p.y+p.h,p.face<0);
  }
  for(const q of parts){g.fillStyle=q.c;g.fillRect(Math.round(q.x-camI),Math.round(q.y),3,3)}
  g.restore();
  for(let i=0;i<3;i++)heart(10+i*28,10,i<P.hp?'#e0402f':'#3a2a4a');
  tx('Gems '+got+' / '+GEMS.length,W-12,28,'#8fe9ff',16,'right');tx('Level '+(lvl+1),12,56,'#cfd8ff',13);
  const panel=(a,b)=>{const y=H*.16;g.fillStyle='rgba(8,12,30,.82)';g.fillRect(15,y,240,56+b.length*22);g.strokeStyle='#3d5aa8';g.lineWidth=2;g.strokeRect(16,y+1,238,54+b.length*22);
    tx(a,W/2,y+40,'#f2b84b',30,'center');b.forEach((s,i)=>tx(s,W/2,y+72+i*22,i?'#9fb2e8':'#e8ecff',13,'center'))};
  const gl='Gems collected: '+got+' / '+GEMS.length;
  if(state==='title')panel('Castle Run',['Arrows or A / D to move','Space to jump, X to hit','Reach the treasure chest','Tap or press any key']);
  if(state==='over')panel(why==='fall'?'You fell':'Defeated',[gl,'Tap or press any key']);
  if(state==='win')panel(lvl<LEVELS.length-1?'Level clear':'Treasure found',[gl,lvl<LEVELS.length-1?'Tap for the next level':'Tap or press any key']);
}
function init(){
  setLevel(0);reset();
  let last=0,acc=0;
  const frame=ts=>{acc+=Math.min(ts-last,100);last=ts;while(acc>=16.67){upd();acc-=16.67}draw();requestAnimationFrame(frame)};
  requestAnimationFrame(t=>{last=t;frame(t)});
}
Promise.all(Object.keys(SP).map(k=>new Promise(r=>{const i=new Image();i.onload=r;i.src=SP[k].src;IM[k]=i}))).then(init);
</script>
