<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JavaScript Apps</title>
  <style>
    :root {
      color-scheme: light;
      --page-bg: #f4f6f8;
      --card-bg: #ffffff;
      --text: #17202a;
      --muted: #667085;
      --accent: #5267d8;
      --radius: 16px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: clamp(1rem, 4vw, 3rem);
      background: var(--page-bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(100%, 1200px);
      margin-inline: auto;
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .page-header__content {
      min-width: 0;
    }

    h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(1.75rem, 4vw, 2.5rem);
      line-height: 1.1;
    }

    .page-header p {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
    }

    .filters {
      display: grid;
      flex: 0 1 auto;
      justify-items: end;
      gap: 0.5rem;
    }

    .filter-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 0.5rem;
    }

    .filter-chip {
      padding: 0.45rem 0.85rem;
      border: 1px solid #d0d5dd;
      border-radius: 999px;
      background: var(--card-bg);
      color: var(--text);
      font: inherit;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .app-dialog__header {
      position: absolute;
      top: -26px;
      right: 0;
      left: 0;
      height: 32px;
    }

    .app-dialog__title {
      display: none;
    }

    .filter-chip[aria-pressed="true"] {
      border-color: var(--accent);
      background: var(--accent);
      color: white;
    }

    .filter-chip:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr));
      gap: clamp(1rem, 2.5vw, 1.5rem);
      align-items: start;
    }

    .app-section + .app-section {
      margin-top: 2.5rem;
    }

    .app-section__header {
      margin-bottom: 1rem;
    }

    .app-section__header h2 {
      margin: 0 0 0.35rem;
      font-size: 1.5rem;
    }

    .app-section__header p {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
    }

    .card {
      aspect-ratio: 3 / 4;
      min-width: 0;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      overflow: hidden;
      isolation: isolate;
      padding: 1.25rem;
      border-radius: var(--radius);
      background: #26344a;
      color: white;
      box-shadow: 0 8px 24px rgb(20 30 50 / 12%);
      text-decoration: none;
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    .card[hidden] {
      display: none;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 14px 32px rgb(20 30 50 / 18%);
    }

    .card:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 4px;
    }

    dialog::backdrop {
      background: rgb(0 0 0 / 55%);
    }

    .app-dialog {
      width: min(400px, calc(100vw - 4px), calc(57.142857dvh - 2.285714px));
      aspect-ratio: 4 / 7;
      max-height: calc(100dvh - 4px);
      padding: 4px;
      border: solid #20242b;
      border-width: 32px 2px;
      border-radius: 40px;
      outline: 1px solid white;
      overflow: visible;
      box-shadow: 0 24px 64px rgb(0 0 0 / 35%);
      background-color: #20242b;
    }

    .app-dialog__close {
      position: absolute;
      top: 2px;
      right: 10px;
      z-index: 1;
      width: 28px;
      height: 28px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background-color: rgb(0 0 0 / 50%);
      color: white;
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
    }

    .app-dialog__frame {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 8px;
      background-color: #20242b;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      background:
        linear-gradient(145deg, rgb(23 32 51 / 82%), rgb(23 32 51 / 26%)),
        var(--card-image, none) center / cover no-repeat,
        radial-gradient(circle at 75% 20%, rgb(255 255 255 / 35%), transparent 28%);
    }

    .card::after {
      content: "";
      position: absolute;
      inset: 35% 0 0;
      z-index: -1;
      background: linear-gradient(transparent, rgb(0 0 0 / 78%));
    }

    .card-number {
      position: absolute;
      top: 1rem;
      left: 1.1rem;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      opacity: 0.85;
    }

    .card-content h2 {
      margin: 0 0 0.5rem;
      font-size: clamp(1.2rem, 2vw, 1.55rem);
      line-height: 1.15;
    }

    .card-content p {
      margin: 0;
      color: rgb(255 255 255 / 85%);
      font-size: 0.95rem;
      line-height: 1.45;
    }

    @media (max-width: 520px) {
      .app-dialog {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        width: 100vw;
        height: 100dvh;
        max-width: none;
        max-height: none;
        aspect-ratio: auto;
        margin: 0;
        padding: 0;
        border: 0;
        border-radius: 0;
        outline: none;
        overflow: hidden;
        box-shadow: none;
      }

      .app-dialog__header {
        position: relative;
        top: auto;
        right: auto;
        left: auto;
        display: flex;
        flex: 0 0 48px;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 0 12px;
        background: #20242b;
      }

      .app-dialog__title {
        display: block;
        min-width: 0;
        overflow: hidden;
        color: white;
        font-size: 1rem;
        font-weight: 600;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .app-dialog__close {
        position: static;
        flex: 0 0 28px;
      }

      .app-dialog__frame {
        flex: 1;
        min-height: 0;
        border-radius: 0;
      }

      .page-header {
        align-items: flex-start;
        flex-wrap: wrap;
      }

      .filters {
        justify-items: start;
        max-width: 100%;
      }

      .filter-group {
        justify-content: flex-start;
      }

      .card-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.85rem;
      }

      .card {
        padding: 0.9rem;
        border-radius: 12px;
      }

      .card-content h2 { font-size: 1.05rem; }
      .card-content p { font-size: 0.82rem; }
      .card-number { top: 0.75rem; left: 0.8rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    .footer-content {
      text-align: right;
      padding: 64px 0 16px;
    }
  </style>
</head>
<body>
  <main>
    <header class="page-header">
      <div class="page-header__content">
        <h1>JavaScript Apps</h1>
        <p>Apps Built with JavaScript, CSS, and HTML</p>
      </div>
      <section class="filters" aria-label="Filter apps">
        <div id="typeFilters" class="filter-group" role="group" aria-label="Filter by type"></div>
      </section>
    </header>

    <div id="appSections"></div>

    <footer>
      <p class="footer-content">
        © 2026 <a href="https://darin-portfolio-ten.vercel.app/">Darin F. Miller</a>
      </p>
    </footer>
  </main>
  <script>
    const APP_TYPES = Object.freeze({
      GAME: 'game',
      UTILITY: 'utility'
    });
    const APP_SECTIONS = Object.freeze({
      PLAY_STORE: 'Play Store Apps',
      VIBE_CODED: 'Vibe Coded Apps'
    });
    const ALL_FILTER = 'all';

    const cards = [
      {
        type: APP_TYPES.GAME,
        section: APP_SECTIONS.PLAY_STORE,
        title: 'AI Memory',
        description: 'Play Memory against the AI',
        href: './AI-Memory/index.html',
        image: './AI-Memory/screen-shot.png'
      },
      {
        type: APP_TYPES.GAME,
        section: APP_SECTIONS.PLAY_STORE,
        title: 'Easy Crosswords',
        description: 'Crossword puzzle with hints',
        href: './EasyCrosswords/crossword.html',
        image: './EasyCrosswords/320x480.png'
      },
      {
        type: APP_TYPES.UTILITY,
        section: APP_SECTIONS.VIBE_CODED,
        title: 'Inkling',
        description: 'Draw and write',
        href: './Inkling/inkling.html',
        image: './Inkling/screenshot.png'
      },
      {
        type: APP_TYPES.GAME,
        section: APP_SECTIONS.PLAY_STORE,
        title: 'Jigsaws',
        description: 'Jigsaw puzzles in various sizes',
        href: './Jigsaws/jigsaws.html',
        image: './Jigsaws/jigsaw.png'
      },
      {
        type: APP_TYPES.GAME,
        section: APP_SECTIONS.PLAY_STORE,
        title: 'Jumbled Quotes',
        description: 'Arrange the letters to complete a quotation',
        href: './JumbledQuotes/jumbled_quotes.html',
        image: './JumbledQuotes/screenshot.png'
      },
      {
        type: APP_TYPES.GAME,
        section: APP_SECTIONS.PLAY_STORE,
        title: 'Mazes',
        description: 'Solve mazes',
        href: './Mazes/index.html',
        image: './Mazes/screenshot.png'
      },
      {
        type: APP_TYPES.GAME,
        section: APP_SECTIONS.PLAY_STORE,
        title: 'Photo Puzzle',
        description: '',
        href: './PhotoPuzzle/index.html',
        image: './PhotoPuzzle/screenshot.png'
      },
      {
        type: APP_TYPES.GAME,
        section: APP_SECTIONS.VIBE_CODED,
        title: 'Planet Explorers',
        description: 'Explore planets',
        href: './PlanetExplorers/alien-planet-game.html',
        image: './PlanetExplorers/screenshot.png'
      },
      {
        type: APP_TYPES.UTILITY,
        section: APP_SECTIONS.VIBE_CODED,
        title: 'Recipe Box',
        description: 'Recipe storage',
        href: './RecipeBox/recipe-box.html',
        image: './RecipeBox/screenshot.png'
      },
      {
        type: APP_TYPES.GAME,
        section: APP_SECTIONS.PLAY_STORE,
        title: 'RYB ColorMixing',
        description: 'Select the result when 2 colors mix',
        href: './ColorMixing/index.html',
        image: './ColorMixing/ryb.png'
      },
      {
        type: APP_TYPES.GAME,
        section: APP_SECTIONS.VIBE_CODED,
        title: 'Stone Maze Hero',
        description: 'Explore an underground dungeon',
        href: './StoneMazeHero/stone-maze-hero.html',
        image: './StoneMazeHero/screenshot.png'
      },
      {
        type: APP_TYPES.GAME,
        section: APP_SECTIONS.PLAY_STORE,
        title: 'Word Search Crush',
        description: 'Find words and crush them',
        href: './WordSearchCrush/index.html',
        image: './WordSearchCrush/screenshot.png'
      },
      {
        type: APP_TYPES.GAME,
        section: APP_SECTIONS.PLAY_STORE,
        title: 'Word Search Library',
        description: 'Classic word search with multiple themes',
        href: './WordSearchLibrary/index.html',
        image: './WordSearchLibrary/screenshot.png'
      },
    ];

    const appSections = [
      {
        name: APP_SECTIONS.PLAY_STORE,
        description: 'Google Play Store apps, coded by hand. (Voluntarily removed due to their public disclosure of personal information.)'
      },
      {
        name: APP_SECTIONS.VIBE_CODED,
        description: 'Apps created with the assistance of Artifical Inteligence.'
      }
    ];
    const activeType = { value: ALL_FILTER };
    const appSectionsContainer = document.querySelector('#appSections');

    appSectionsContainer.innerHTML = appSections.map((section, index) => `
      <section class="app-section" aria-labelledby="appSectionTitle${index}">
        <header class="app-section__header">
          <h2 id="appSectionTitle${index}">${section.name}</h2>
          <p>${section.description}</p>
        </header>
        <div class="card-grid" data-section="${section.name}"></div>
      </section>
    `).join('');

    appSections.forEach((section) => {
      const cardGrid = appSectionsContainer.querySelector(
        `.card-grid[data-section="${section.name}"]`
      );
      cardGrid.innerHTML = cards
        .filter((card) => card.section === section.name)
        .map((card) => `
          <a
            class="card"
            data-type="${card.type}"
            style="--card-image: url('${card.image}');"
            href="${card.href}"
            onclick="event.preventDefault(); openPageDialog('${card.href}', '${card.title}')"
          >
            <span class="card-number">${card.type.toUpperCase()}</span>
            <div class="card-content">
              <h2>${card.title}</h2>
              <p>${card.description}</p>
            </div>
          </a>
        `).join('');
    });

    function createFilterChips(container, values, allLabel) {
      const options = [
        [ALL_FILTER, allLabel],
        ...values.map((value) => [value, value[0].toUpperCase() + value.slice(1)])
      ];

      options.forEach(([value, label]) => {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'filter-chip';
        chip.textContent = label;
        chip.setAttribute('aria-pressed', String(activeType.value === value));
        chip.addEventListener('click', () => {
          activeType.value = value;
          container.querySelectorAll('.filter-chip').forEach((option) => {
            option.setAttribute('aria-pressed', String(option === chip));
          });
          appSectionsContainer.querySelectorAll('.app-section').forEach((section) => {
            const cards = section.querySelectorAll('.card');
            cards.forEach((card) => {
              card.hidden = activeType.value !== ALL_FILTER && card.dataset.type !== activeType.value;
            });
            section.hidden = [...cards].every((card) => card.hidden);
          });
        });
        container.appendChild(chip);
      });
    }

    createFilterChips(
      document.querySelector('#typeFilters'),
      Object.values(APP_TYPES),
      'All types'
    );

    function openPageDialog(url, title) {
      const dialog = document.createElement('dialog');
      dialog.className = 'app-dialog';

      const header = document.createElement('div');
      header.className = 'app-dialog__header';

      const titleElement = document.createElement('span');
      titleElement.className = 'app-dialog__title';
      titleElement.textContent = title;

      const closeButton = document.createElement('button');
      closeButton.type = 'button';
      closeButton.setAttribute('aria-label', 'Close app');
      closeButton.textContent = '×';
      closeButton.className = 'app-dialog__close';
      closeButton.addEventListener('click', () => dialog.close());

      const iframe = document.createElement('iframe');
      iframe.src = url;
      iframe.className = 'app-dialog__frame';

      header.appendChild(titleElement);
      header.appendChild(closeButton);
      dialog.appendChild(header);
      dialog.appendChild(iframe);
      document.body.appendChild(dialog);

      // Center the dialog and open it as a modal
      dialog.showModal();

      const previousRootOverflow = document.documentElement.style.overflow;
      const previousBodyOverflow = document.body.style.overflow;
      document.documentElement.style.overflow = 'hidden';
      document.body.style.overflow = 'hidden';

      function confirmClose() {
        if (window.confirm('Are you sure you want to close this app?')) {
          dialog.close();
        }
      }

      // Close when clicking outside the dialog
      dialog.addEventListener('click', (event) => {
        if (event.target === dialog) {
          confirmClose();
        }
      });

      // Confirm before closing with Escape
      dialog.addEventListener('cancel', (event) => {
        event.preventDefault();
        confirmClose();
      });

      // Remove the dialog from the DOM when closed
      dialog.addEventListener('close', () => {
        document.documentElement.style.overflow = previousRootOverflow;
        document.body.style.overflow = previousBodyOverflow;
        dialog.remove();
      });
    }
  </script>
</body>
</html>
