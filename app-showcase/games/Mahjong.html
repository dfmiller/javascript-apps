<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game template</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
/* Colors: change these tokens to re-skin. Dark values are in the two blocks below. */
:root{--bg:#e9efee;--panel:#fbfdfc;--ink:#12302d;--mute:#5d7a76;--line:#b9cbc7;--bold:#12302d;--sel:#ffd978;--peer:#dcebe8;--same:#bfe0d9;--given:#12302d;--mine:#1b6e8a;--err:#d64545;--btn:#12302d;--btnink:#f2faf8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1716;--panel:#16231f;--ink:#e3f1ee;--mute:#8aa6a1;--line:#2c4540;--bold:#9bbcb6;--sel:#8a6a12;--peer:#1d2f2b;--same:#2a4a44;--given:#e3f1ee;--mine:#6cc3e0;--err:#ff7b7b;--btn:#e3f1ee;--btnink:#0e1716}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:480px;padding:14px 12px 24px}
header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.02em}
.stats{display:flex;gap:14px;color:var(--mute);font-size:15px;font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:600}
#tm,#ms{display:inline-block}#ms{transform-origin:right center}
.pop{animation:pop2 .9s}@keyframes pop2{0%,100%{transform:scale(1)}30%{transform:scale(2.5)}}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;color:var(--mute);font:inherit;font-size:15px;padding:8px 0;border-radius:7px;cursor:pointer}
.seg button.on{background:var(--btn);color:var(--btnink);font-weight:600}
#board{display:grid;aspect-ratio:var(--ar,1);width:100%;background:var(--panel);border:2.5px solid var(--bold);border-radius:6px;overflow:hidden;touch-action:manipulation}
.c{position:relative;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--panel);color:var(--mine);font:inherit;font-size:clamp(20px,6.4vw,30px);font-weight:600;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;min-width:0}
.c.rb{border-right:2.5px solid var(--bold)}.c.bb{border-bottom:2.5px solid var(--bold)}.c.re{border-right:0}.c.be{border-bottom:0}
/* Cell state classes returned by G.cell(): add your own below */
.c.sel{background:var(--sel);color:var(--ink)}.c.p{background:var(--peer)}.c.s2{background:var(--same)}
.c.lit{background:var(--sel)}.c.bad{color:var(--err)}
.c.e{background:var(--bg);cursor:default}
.c.t{background:var(--panel);box-shadow:inset 0 -4px 0 var(--line)}
.c.t.bk{background:var(--peer);opacity:.6}
.c.t img{width:86%;height:86%;object-fit:contain;pointer-events:none}
.c.t .g{display:flex;flex-direction:column;align-items:center;line-height:1;font-size:clamp(20px,6vw,28px)}
.c.t .g i{font-style:normal;font-size:.55em;margin-top:2px}
.c.t u{position:absolute;top:2px;left:4px;font-size:10px;text-decoration:none;color:var(--mute);font-weight:400}
.c.t.sel,.c.t.lit{background:var(--sel)}
.c.k0{color:var(--err)}.c.k1{color:var(--mine)}.c.k2{color:#2e8b57}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .c.k2{color:#6fd19a}}
.c.flash::after{content:"";position:absolute;inset:0;background:var(--mine);opacity:0;pointer-events:none;animation:fl .6s ease-out}
@keyframes fl{0%{opacity:.6}100%{opacity:0}}
.pad{display:grid;gap:5px;margin-top:14px}
.pad button{position:relative;aspect-ratio:3/4;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;font:inherit;font-size:clamp(20px,6vw,26px);font-weight:600;cursor:pointer;padding:0}
.pad button small{position:absolute;bottom:3px;left:0;right:0;font-size:10px;font-weight:400;color:var(--mute)}
.pad button:disabled{opacity:.28;cursor:default}
.tools{display:grid;gap:8px;margin-top:12px}
.tools button{border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:15px;padding:12px 0;border-radius:10px;cursor:pointer}
.tools button.on{background:var(--btn);color:var(--btnink);border-color:var(--btn)}
.tools button:disabled{opacity:.35;cursor:default}
button:focus-visible{outline:3px solid var(--mine);outline-offset:2px}
#st{min-height:20px;margin:10px 2px 0;color:var(--mute);font-size:14px;text-align:center;line-height:1.35}
#ov{position:fixed;inset:0;background:rgba(8,16,15,.62);display:none;align-items:center;justify-content:center;padding:24px;z-index:20}
#ov.show{display:flex}
#ov div{background:var(--panel);border-radius:16px;padding:26px 24px;text-align:center;max-width:320px;width:100%}
#ov h2{margin:0 0 6px;font-size:26px;font-weight:800}
#ov p{margin:0 0 18px;color:var(--mute);font-size:16px;line-height:1.4}
#ov .row{display:flex;gap:10px;justify-content:center}
#ov button{border:0;background:var(--btn);color:var(--btnink);font:inherit;font-size:16px;font-weight:600;padding:12px 22px;border-radius:10px;cursor:pointer}
#ov button.alt{background:none;color:var(--ink);border:1px solid var(--line)}
#oc{display:none}#ov.ask #oc{display:inline-block}
@media (prefers-reduced-motion:reduce){.pop,.c.flash::after{animation:none}}

/* tile look: your images carry their own shadow */
#board{aspect-ratio:auto!important;background:#14501f;padding:26px 12px 12px 26px;overflow:hidden}
#board .c{border:0;background:transparent;box-shadow:none;aspect-ratio:147/151;align-self:start;overflow:visible;cursor:pointer}
#board .c.e{cursor:default}
#board .c img{position:absolute;width:100%;height:100%;pointer-events:none;max-width:none;filter:drop-shadow(3px 5px 4px rgba(0,0,0,.6)) drop-shadow(1px 1px 1px rgba(0,0,0,.5))}
#board .c.bk img:last-of-type{filter:brightness(.72) drop-shadow(3px 5px 4px rgba(0,0,0,.6)) drop-shadow(1px 1px 1px rgba(0,0,0,.5))}
#board .c.sel img:last-of-type,#board .c.lit img:last-of-type{filter:sepia(.9) saturate(3.2) brightness(1.08) drop-shadow(3px 5px 4px rgba(0,0,0,.6))}
#board .c.flash::after{display:none}
</style>
</head>
<body>
<main>
<header><h1 id="ti"></h1><div class="stats"><span>Time <b id="tm">0:00</b></span><span><span id="sl"></span> <b id="ms">0</b></span></div></header>
<div class="seg" id="seg"></div>
<div id="board"></div>
<div class="pad" id="pad"></div>
<div class="tools" id="tools"></div>
<p id="st"></p>
</main>
<div id="ov"><div><h2 id="ot"></h2><p id="op"></p><span class="row"><button id="oc" class="alt">Keep playing</button><button id="ob">New game</button></span></div></div>

const shape=lv=>{const H=Array(R*C).fill(0),add=(r0,r1,c0,c1)=>{for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++)H[r*C+c]++};
  if(lv==0){add(1,6,1,4);add(3,4,2,3)}
  else if(lv==1){add(0,7,1,4);add(1,6,1,4);add(3,4,2,3)}
  else{add(0,7,0,5);add(1,6,1,4);add(2,5,2,3);add(3,4,2,3)}
  return H};
const isFree=(st,i)=>{const n=st[i].length,c=i%C,L=c>0?st[i-1].length:0,Rt=c<C-1?st[i+1].length:0;return n>0&&(L<n||Rt<n)};
function gen(lv){
  const nf=54,ord=[...Array(54).keys()].sort(()=>Math.random()-.5);
  for(;;){
    const hh=shape(lv),st=hh.map(()=>[]);let k=0,ok=true,left=hh.reduce((a,b)=>a+b,0);
    const real=hh.map(h=>h);
    while(left>0){
      const fr=[];for(let i=0;i<R*C;i++){if(hh[i]>0){const c=i%C,L=c>0?hh[i-1]:0,Rt=c<C-1?hh[i+1]:0;if(L<hh[i]||Rt<hh[i])fr.push(i)}}
      if(fr.length<2){ok=false;break}
      const a=fr.splice(Math.random()*fr.length|0,1)[0],b=fr[Math.random()*fr.length|0],f=ord[k++%nf];
      st[a].unshift(f);st[b].unshift(f);hh[a]--;hh[b]--;left-=2;
    }
    if(ok){// rebuild so stacks are bottom-first: unshift put later-removed tiles lower, which is what we want
      return st}
  }
}
const pairs=S=>{const m={};for(let i=0;i<R*C;i++)if(isFree(S.st,i)){const f=S.st[i][S.st[i].length-1];(m[f]=m[f]||[]).push(i)}
  for(const f in m)if(m[f].length>1)return[m[f][0],m[f][1]];return null};
const topF=(S,i)=>S.st[i][S.st[i].length-1];
const G={
  id:'mahjong',
  title:'Mahjong',
  levels:['Easy','Medium','Hard'],
  rows:R, cols:C,
  box:null,
  statLabel:'Pairs',
  pad:null,
  tools:[{id:'hint',label:S=>'Hint'},{id:'undo',label:S=>'Undo',disabled:S=>!S.hist.length}],
  newState(level){const st=gen(level);return{st,sel:-1,hl:[],hist:[]}},
  cell(S,i){
    const n=S.st[i].length;if(!n)return{c:'e'};
    const fr=isFree(S.st,i);
    const c='t'+(fr?'':' bk')+(S.sel===i?' sel':'')+(S.hl.includes(i)?' lit':'');
    let h='';for(let j=0;j<n;j++){const x=-j*10,y=-j*11;h+='<img alt="" draggable="false" src="'+IMG[S.st[i][j]]+'" style="left:'+x+'%;top:'+y+'%">'}
    return{c,h};
  },
  tap(S,i){
    S.hl=[];if(!S.st[i].length||!isFree(S.st,i))return;
    if(S.sel<0||S.sel===i){S.sel=S.sel===i?-1:i;return}
    if(topF(S,i)===topF(S,S.sel)){const j=S.sel,f=topF(S,i);S.st[i].pop();S.st[j].pop();S.hist.push([i,j,f]);S.sel=-1;pulse('#ms')}
    else S.sel=i;
  },
  padTap(S,d){},
  tool(S,id){

    if(id==='undo'&&S.hist.length){const[i,j,f]=S.hist.pop();S.st[i].push(f);S.st[j].push(f);S.sel=-1}
  },
  won(S){return S.st.every(s=>!s.length)},
  lost(S){return !pairs(S)},
  loseText:'No more matching pairs are free.',

$('#ti').textContent=G.title;document.title=G.title;$('#sl').textContent=G.statLabel;
const board=$('#board');
board.style.gridTemplateColumns='repeat('+G.cols+',1fr)';board.style.setProperty('--ar',G.cols/G.rows);
for(let i=0;i<G.rows*G.cols;i++){
  const r=i/G.cols|0,c=i%G.cols,b=G.box;
  const cls='c'+(b&&(c+1)%b[1]==0&&c<G.cols-1?' rb':'')+(b&&(r+1)%b[0]==0&&r<G.rows-1?' bb':'')+(c==G.cols-1?' re':'')+(r==G.rows-1?' be':'');
  base.push(cls);const el=document.createElement('button');el.className=cls;
  el.setAttribute('aria-label','Row '+(r+1)+' column '+(c+1));
  el.onclick=()=>{if(over)return;sel=i;G.tap(S,i);after()};board.append(el);cells.push(el);
}
if(G.pad){const p=$('#pad');p.style.gridTemplateColumns='repeat('+G.pad.length+',1fr)';
  G.pad.forEach(d=>{const b=document.createElement('button');b.innerHTML=d+'<small></small>';b.onclick=()=>{if(!over){G.padTap(S,d);after()}};p.append(b);pbs.push(b)})}
const tl=$('#tools');tl.style.gridTemplateColumns='repeat('+(G.tools.length+1)+',1fr)';
G.tools.forEach(t=>{const b=document.createElement('button');b.onclick=()=>{if(!over){G.tool(S,t.id);after()}};tl.append(b);tbs.push(b)});
const nb=document.createElement('button');nb.textContent='New game';nb.onclick=()=>requestNew();tl.append(nb);
G.levels.forEach((n,i)=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>{if(i!==lv)requestNew(i)};$('#seg').append(b)});

function draw(){
  const now=Date.now();
  cells.forEach((el,i)=>{const r=G.cell(S,i)||{};
    const cls=base[i]+(i===sel&&G.showSel?' sel':'')+(r.c?' '+r.c:'');
    const sig=cls+'|'+(r.h!=null?r.h:r.t||'');
    el.className=cls;if(r.h!=null)el.innerHTML=r.h;else el.textContent=r.t||'';
    if(prev[i]!==undefined&&prev[i]!==sig){until[i]=now+600;void el.offsetWidth}   /* tile changed: flash it */
    if(now<(until[i]||0))el.className=cls+' flash';
    prev[i]=sig});
  pbs.forEach((b,k)=>{const d=G.pad[k];b.disabled=over||(G.padOff?G.padOff(S,d):false);b.lastChild.textContent=G.padNote?G.padNote(S,d):''});
  G.tools.forEach((t,k)=>{tbs[k].textContent=t.label(S);tbs[k].disabled=over||(t.disabled?t.disabled(S):false);tbs[k].classList.toggle('on',!!(t.on&&t.on(S)))});
  $('#ms').textContent=G.statText(S);$('#st').textContent=flash||G.hint(S)||'';
  [...$('#seg').children].forEach((b,i)=>b.classList.toggle('on',i===lv));
}
function after(){draw();save();if(over)return;if(G.won(S))end(true);else if(G.lost(S))end(false)}
function end(win){
  over=true;
  if(win){let rec='';
    try{const k=G.id+'-best-'+lv,b=+localStorage.getItem(k)||0;if(!b||secs<b){localStorage.setItem(k,secs);rec=b?' New best for this level.':''}else rec=' Best: '+fmt(b)+'.'}catch(e){}
    $('#ot').textContent='Solved';$('#op').textContent='Finished '+G.levels[lv].toLowerCase()+' in '+fmt(secs)+'.'+rec;
  }else{$('#ot').textContent='Round over';$('#op').textContent=G.loseText||'Try a fresh game.'}
  try{localStorage.removeItem(G.id+'-game')}catch(e){}
  $('#ov').classList.remove('ask');$('#ov').classList.add('show');draw();
}
function newGame(l){
  if(l!==undefined)lv=l;prev.length=0;until.length=0;S=G.newState(lv);secs=0;over=false;sel=-1;flash='';
  $('#ov').classList.remove('show','ask');$('#tm').textContent='0:00';draw();save();
}
function requestNew(l){
  const started=!over&&(G.started?G.started(S):secs>3);
  if(!started){newGame(l);return}
  pend=l;$('#ot').textContent='Start a new game?';$('#op').textContent='Your progress on this game will be lost.';
  $('#ov').classList.add('show','ask');
}
$('#ob').onclick=()=>{const l=pend;pend=undefined;newGame(l)};
$('#oc').onclick=()=>{pend=undefined;$('#ov').classList.remove('show','ask')};
function save(){try{localStorage.setItem(G.id+'-game',JSON.stringify({lv,S,secs}))}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem(G.id+'-game'));if(s&&s.S){lv=s.lv;S=s.S;secs=s.secs;$('#tm').textContent=fmt(secs);draw();return true}}catch(e){}return false}
document.addEventListener('keydown',e=>{if(G.key&&!over){G.key(S,e);after()}});
setInterval(()=>{if(!over&&!document.hidden){secs++;$('#tm').textContent=fmt(secs);if(secs%5==0)save()}},1000);
if(!load())newGame(0);
</script>
</body>
</html>
