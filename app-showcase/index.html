<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>App Showcase</title>
  <meta name="description" content="Browse our apps and open any of them in a new tab.">
  <meta name="theme-color" content="#12304a">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Showcase">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="bar">
    <a class="brand">
      <img src="icons/icon-192.png" width="32" height="32" alt="" aria-hidden="true" /> Digital Fun Media
    </a>
    <button id="install" class="install" type="button" hidden>Install app</button>
  </header>

  <main>
    <h1 class="sr-only">Featured apps</h1>

    <section id="carousel" class="carousel" aria-roledescription="carousel" aria-label="Featured apps">
      <div class="viewport" id="viewport"></div>

      <button class="arrow prev" type="button" aria-label="Previous app">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="arrow next" type="button" aria-label="Next app">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>

      <div class="dots" role="group" aria-label="Choose an app"></div>
      <p class="sr-only" id="status" aria-live="polite"></p>
    </section>

    <noscript><p class="nojs">Turn on JavaScript to browse the apps.</p></noscript>
  </main>

  <script src="apps.js"></script>
  <script src="app.js"></script>
</body>
</html>
